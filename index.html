<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Решение квадратных уравнений</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .equation-view {
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #555;
        }
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        input {
            width: 60px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #4A90E2;
            outline: none;
        }
        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #357ABD; }
        #result {
            margin-top: 1.5rem;
            text-align: left;
            padding: 1rem;
            border-radius: 6px;
            background: #f9f9f9;
            min-height: 50px;
            display: none;
        }
        .step { color: #666; font-size: 0.9rem; margin-bottom: 5px; }
        .answer { font-weight: bold; color: #2c3e50; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Квадратное уравнение</h1>
    <div class="equation-view">ax² + bx + c = 0</div>
    
    <div class="input-group">
        <input type="number" id="a" placeholder="a" step="any">
        <input type="number" id="b" placeholder="b" step="any">
        <input type="number" id="c" placeholder="c" step="any">
    </div>

    <button onclick="solve()">Решить уравнение</button>

    <div id="result"></div>
</div>

<script>
    function solve() {
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const c = parseFloat(document.getElementById('c').value);
        const resultDiv = document.getElementById('result');

        if (isNaN(a) || isNaN(b) || isNaN(c)) {
            alert("Пожалуйста, введите все коэффициенты");
            return;
        }

        if (a === 0) {
            alert("Коэффициент 'a' не может быть равен 0 (это будет линейное уравнение)");
            return;
        }

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '';

        // Вычисляем дискриминант
        const D = b * b - 4 * a * c;
        
        let html = `<div class="step">1. Дискриминант D = b² - 4ac</div>`;
        html += `<div class="step">D = ${b}² - 4 · ${a} · ${c} = <b>${D}</b></div>`;

        if (D > 0) {
            const x1 = (-b + Math.sqrt(D)) / (2 * a);
            const x2 = (-b - Math.sqrt(D)) / (2 * a);
            html += `<div class="step">2. D > 0, значит 2 корня:</div>`;
            html += `<div class="answer">x₁ = ${x1.toFixed(3)}</div>`;
            html += `<div class="answer">x₂ = ${x2.toFixed(3)}</div>`;
        } else if (D === 0) {
            const x = -b / (2 * a);
            html += `<div class="step">2. D = 0, значит 1 корень:</div>`;
            html += `<div class="answer">x = ${x.toFixed(3)}</div>`;
        } else {
            html += `<div class="step">2. D < 0</div>`;
            html += `<div class="answer">Действительных корней нет</div>`;
        }

        resultDiv.innerHTML = html;
    }
</script>

</body>
</html>
