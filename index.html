<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Xeno Hunter FIXED</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:Arial; }

#overlay {
    position:absolute;
    width:100%; height:100%;
    background:radial-gradient(circle,#02040a,#000);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    color:white; z-index:10; cursor:pointer;
}

#hud {
    position:absolute; top:20px; left:20px;
    color:#00ffcc; font-size:20px;
}

#crosshair {
    position:absolute;
    top:50%; left:50%;
    width:20px; height:20px;
    border:2px solid #00ffcc;
    border-radius:50%;
    transform:translate(-50%,-50%);
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>

<body>

<div id="overlay">КЛИКНИ ЧТОБЫ НАЧАТЬ</div>
<div id="hud">УБИТО: <span id="kills">0</span></div>
<div id="crosshair"></div>

<script>
let scene, camera, renderer, controls;
let aliens = [];
let kills = 0;
let prevTime = performance.now();
let move = {f:0,b:0,l:0,r:0};

init();

function init(){

    scene = new THREE.Scene();

    // 🌌 КОСМОС
    const stars = new THREE.BufferGeometry();
    const starCount = 2000;
    const pos = [];

    for(let i=0;i<starCount;i++){
        pos.push((Math.random()-0.5)*500);
        pos.push((Math.random()-0.5)*500);
        pos.push((Math.random()-0.5)*500);
    }

    stars.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));

    const starMat = new THREE.PointsMaterial({color:0xffffff});
    const starField = new THREE.Points(stars, starMat);
    scene.add(starField);

    camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    document.body.appendChild(renderer.domElement);

    // СВЕТ
    scene.add(new THREE.AmbientLight(0xffffff,1));
    const light = new THREE.PointLight(0x00ffcc,2,50);
    light.position.set(0,10,0);
    scene.add(light);

    // ПОЛ
    const grid = new THREE.GridHelper(200,50,0x00ffcc,0x002222);
    scene.add(grid);

    controls = new THREE.PointerLockControls(camera,document.body);

    document.getElementById("overlay").onclick=()=>{
        controls.lock();
        startGame();
    };

    controls.addEventListener("lock",()=>{
        overlay.style.display="none";
    });

    controls.addEventListener("unlock",()=>{
        overlay.style.display="flex";
    });

    document.addEventListener("keydown",e=>{
        if(e.code==="KeyW")move.f=1;
        if(e.code==="KeyS")move.b=1;
        if(e.code==="KeyA")move.l=1;
        if(e.code==="KeyD")move.r=1;
    });

    document.addEventListener("keyup",e=>{
        if(e.code==="KeyW")move.f=0;
        if(e.code==="KeyS")move.b=0;
        if(e.code==="KeyA")move.l=0;
        if(e.code==="KeyD")move.r=0;
    });

    document.addEventListener("mousedown",shoot);

    animate();
}

function startGame(){
    aliens.forEach(a=>scene.remove(a));
    aliens=[];
    kills=0;
    document.getElementById("kills").innerText=0;

    // 👾 СПАВН ВРАГОВ (гарантированно видимых)
    for(let i=0;i<6;i++){
        spawnEnemy(i*2);
    }
}

function spawnEnemy(offset){
    const group = new THREE.Group();

    // ЯРКИЙ ВРАГ (невозможно не увидеть)
    const mat = new THREE.MeshBasicMaterial({color:0xff0033});

    const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.6,1.2,4,8),
        mat
    );
    body.position.y=1;

    const eye = new THREE.Mesh(
        new THREE.SphereGeometry(0.2,8,8),
        new THREE.MeshBasicMaterial({color:0xffffff})
    );
    eye.position.set(0,2,0.5);

    group.add(body,eye);

    // 💥 ВСЕГДА ПЕРЕД ИГРОКОМ
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    const side = new THREE.Vector3(-dir.z,0,dir.x);

    const pos = camera.position.clone()
        .add(dir.multiplyScalar(12))
        .add(side.multiplyScalar(offset-5));

    group.position.set(pos.x,0,pos.z);

    scene.add(group);
    aliens.push(group);
}

function shoot(){

    const ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0,0),camera);

    const meshes=[];
    aliens.forEach(a=>{
        a.children.forEach(c=>{
            c.parentRef=a;
            meshes.push(c);
        });
    });

    const hits = ray.intersectObjects(meshes);

    if(hits.length>0){
        const enemy = hits[0].object.parentRef;

        scene.remove(enemy);
        aliens = aliens.filter(a=>a!==enemy);

        kills++;
        document.getElementById("kills").innerText=kills;

        spawnEnemy(Math.random()*10-5);
    }
}

function animate(){
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time-prevTime)/1000;

    if(controls.isLocked){

        const speed = 10*delta;

        if(move.f)controls.moveForward(speed);
        if(move.b)controls.moveForward(-speed);
        if(move.l)controls.moveRight(-speed);
        if(move.r)controls.moveRight(speed);

        aliens.forEach(a=>{
            a.lookAt(camera.position);
            a.translateZ(2*delta);

            if(a.position.distanceTo(camera.position)<2){
                alert("ТЕБЯ УБИЛИ");
                location.reload();
            }
        });
    }

    prevTime=time;
    renderer.render(scene,camera);
}

window.onresize=()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
};
</script>

</body>
</html>
