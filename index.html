<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Solver Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --primary: #8b5cf6;
            --accent: #06b6d4;
            --grad: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text: #0f172a;
            --primary: #6366f1;
            --accent: #0ea5e9;
        }

        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background 0.5s ease;
        }

        .main-wrapper {
            max-width: 1100px;
            width: 100%;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tab-btn {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 12px 30px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .tab-btn.active {
            background: var(--grad);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        input {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            color: var(--text);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        [data-theme="light"] input {
            background: #fff;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .btn-solve, .btn-spin, .btn-update-sectors {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: var(--grad);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-solve:hover, .btn-spin:hover, .btn-update-sectors:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4);
        }

        .root-box {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .root-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .fraction {
            text-align: center;
            font-size: 0.95rem;
            min-width: 150px;
        }

        .num {
            border-bottom: 1px solid var(--text);
            padding: 2px 10px;
        }

        .den {
            padding: 2px 10px;
        }

        .val {
            font-family: 'Monaco', monospace;
            color: var(--accent);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .chart-wrap {
            height: 300px;
            margin-top: 30px;
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .history-item:hover {
            opacity: 1;
            background: rgba(255,255,255,0.03);
        }

        .theme-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .author-tag {
            position: fixed;
            bottom: 25px;
            right: 25px;
            font-weight: 900;
            font-size: 1.4rem;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
            z-index: 10;
        }

        .wheel-result {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
            margin-top: 15px;
        }

        .sector-input-area {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        .sector-input {
            flex: 1;
        }
    </style>
</head>
<body data-theme="dark" oncontextmenu="return false;">

<div class="main-wrapper">
    <div class="tab-nav">
        <button class="tab-btn active" data-tab="calc">🧮 Калькулятор</button>
        <button class="tab-btn" data-tab="wheel">🎡 Колесо фортуны</button>
    </div>

    <!-- Вкладка калькулятора (оригинал) -->
    <div class="tab-content active" id="tab-calc">
        <div class="container">
            <div class="left-side">
                <div class="glass-card">
                    <div class="header">
                        <h1>SOLVER PRO</h1>
                        <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
                    </div>
                    <div class="input-group">
                        <input type="number" id="a" placeholder="a" step="any">
                        <input type="number" id="b" placeholder="b" step="any">
                        <input type="number" id="c" placeholder="c" step="any">
                    </div>
                    <button class="btn-solve" onclick="calculate()">Вычислить решение</button>
                    <div id="res-area" class="root-box"></div>
                    <div class="chart-wrap"><canvas id="chart"></canvas></div>
                </div>
            </div>
            <div class="right-side">
                <div class="glass-card" style="height: 100%;">
                    <h3 style="margin: 0; color: var(--primary);">История запросов</h3>
                    <div id="h-list" class="history-list"></div>
                    <button onclick="clearHistory()" style="margin-top: 20px; background: none; border: none; color: #ff4757; cursor: pointer; font-size: 0.8rem;">Очистить всё</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Вкладка колеса фортуны -->
    <div class="tab-content" id="tab-wheel">
        <div class="wheel-container">
            <h2 style="margin:0 0 20px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Колесо фортуны</h2>
            <canvas id="wheelCanvas" width="400" height="400" style="max-width: 100%; height: auto;"></canvas>
            <div class="wheel-result" id="wheelResult"></div>
            <button class="btn-spin" id="spinBtn">Испытать удачу</button>
            <div class="sector-input-area">
                <input type="text" id="sectorInput" class="sector-input" placeholder="Сектора через запятую" value="Подарок, Джекпот, Удача, Сюрприз, 100 монет, Ещё раз, Бонус, Мегаприз">
                <button class="btn-update-sectors" id="updateSectorsBtn" style="width: auto; margin-top:0;">Обновить</button>
            </div>
        </div>
    </div>
</div>

<div class="author-tag">by TapePower</div>

<script>
    // ================== Блокировка просмотра кода ==================
    document.onkeydown = function(e) {
        if (e.keyCode == 123 ||
            (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) ||
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
            return false;
        }
    };

    // ================== Логика табов ==================
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    let currentTab = 'calc';

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const tabName = btn.getAttribute('data-tab');
            if (tabName === currentTab) return;
            tabBtns.forEach(b => b.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            currentTab = tabName;

            if (tabName === 'calc' && chart) {
                setTimeout(() => chart.resize(), 50);
            }
            if (tabName === 'wheel' && !wheelInitialized) {
                initWheel();
                wheelInitialized = true;
            }
        });
    });

    // ================== Калькулятор (без изменений) ==================
    let chart = null;
    let historyData = JSON.parse(localStorage.getItem('eq_history')) || [];

    window.onload = () => {
        renderHistory();
    };

    function toggleTheme() {
        const b = document.body;
        const t = b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', t);
        if (chart) calculate();
    }

    function calculate() {
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const c = parseFloat(document.getElementById('c').value);
        if (isNaN(a) || a === 0) return;

        const D = b * b - 4 * a * c;
        const area = document.getElementById('res-area');
        area.innerHTML = `<div style="font-weight: 600;">Дискриминант D = ${D}</div>`;

        let roots = [];
        if (D > 0) {
            const x1 = (-b + Math.sqrt(D)) / (2 * a);
            const x2 = (-b - Math.sqrt(D)) / (2 * a);
            area.innerHTML += drawRoot("x₁", `-${b} + √${D}`, 2*a, x1);
            area.innerHTML += drawRoot("x₂", `-${b} - √${D}`, 2*a, x2);
            roots = [x1, x2];
        } else if (D === 0) {
            const x = -b / (2 * a);
            area.innerHTML += drawRoot("x", `-${b}`, 2*a, x);
            roots = [x];
        } else {
            area.innerHTML += `<div style="color: #ff4757;">Корней нет</div>`;
        }

        updateChart(a, b, c, roots);
        saveToHistory(a, b, c, roots);
    }

    function drawRoot(name, n, d, v) {
        return `
            <div class="root-item">
                <span style="color: var(--primary); font-weight: 800;">${name}</span>
                <div class="fraction">
                    <div class="num">${n}</div>
                    <div class="den">${d}</div>
                </div>
                <span style="font-weight: 300;">≈</span>
                <div class="val">${v.toFixed(10)}</div>
            </div>
        `;
    }

    function updateChart(a, b, c, roots) {
        const ctx = document.getElementById('chart').getContext('2d');
        const mid = -b / (2 * a);
        const labels = [], data = [];
        for (let x = mid - 5; x <= mid + 5; x += 0.2) {
            labels.push(x.toFixed(1));
            data.push(a * x * x + b * x + c);
        }
        if (chart) chart.destroy();
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    borderColor: '#8b5cf6',
                    borderWidth: 3,
                    pointRadius: 0,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: isDark ? '#64748b' : '#94a3b8' }, grid: { display: false } },
                    y: { ticks: { color: isDark ? '#64748b' : '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function saveToHistory(a, b, c, r) {
        const entry = {
            q: `${a}x² ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c} = 0`,
            a: r.length ? r.map(n => n.toFixed(4)).join('; ') : 'нет корней'
        };
        historyData.unshift(entry);
        if (historyData.length > 20) historyData.pop();
        localStorage.setItem('eq_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('h-list');
        if (!list) return;
        list.innerHTML = historyData.map(i => `
            <div class="history-item">
                <div style="font-weight: 600; color: var(--text);">${i.q}</div>
                <div style="color: var(--accent); margin-top: 5px;">Ответ: ${i.a}</div>
            </div>
        `).join('');
    }

    function clearHistory() {
        localStorage.removeItem('eq_history');
        historyData = [];
        renderHistory();
    }

    // ================== Колесо фортуны (с пользовательскими секторами и звуком) ==================
    let wheelInitialized = false;
    // Дефолтные цвета для секторов
    const defaultColors = [
        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#C9CBCF', '#7BC8A4',
        '#E74C3C', '#3498DB', '#2ECC71', '#F1C40F', '#9B59B6', '#1ABC9C', '#E67E22', '#34495E'
    ];

    // Текущие сектора
    let sectors = [];
    let wheelAngle = 0;
    let spinning = false;
    let lastTickAngle = 0;
    let audioCtx = null;

    // Функция для получения AudioContext
    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
    }

    // Проигрывание звука щелчка
    function playTick() {
        try {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = 800;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.stop(ctx.currentTime + 0.05);
        } catch (e) {
            // Игнорируем ошибки аудио
        }
    }

    // Инициализация колеса
    function initWheel() {
        updateSectorsFromInput();
        drawWheel(wheelAngle);
        document.getElementById('spinBtn').addEventListener('click', spinWheel);
        document.getElementById('updateSectorsBtn').addEventListener('click', updateSectorsFromInput);
    }

    // Обновить сектора из текстового поля
    function updateSectorsFromInput() {
        const input = document.getElementById('sectorInput');
        const newSectors = input.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
        if (newSectors.length === 0) {
            sectors = ['Сектор 1', 'Сектор 2'];
        } else {
            sectors = newSectors.map((label, index) => ({
                label: label,
                color: defaultColors[index % defaultColors.length]
            }));
        }
        drawWheel(wheelAngle);
    }

    // Рисование колеса
    function drawWheel(angle) {
        const canvas = document.getElementById('wheelCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) - 10;
        const numSectors = sectors.length;
        const arc = (2 * Math.PI) / numSectors;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numSectors; i++) {
            const startAngle = angle + i * arc;
            const endAngle = startAngle + arc;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = sectors[i].color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + arc / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Inter, sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(sectors[i].label, radius - 15, 5);
            ctx.restore();
        }

        // Центральный круг
        ctx.beginPath();
        ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Указатель (стрелка сверху)
        ctx.beginPath();
        ctx.moveTo(centerX - 10, centerY - radius + 5);
        ctx.lineTo(centerX + 10, centerY - radius + 5);
        ctx.lineTo(centerX, centerY - radius - 15);
        ctx.closePath();
        ctx.fillStyle = '#FFD700';
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Вращение колеса
    function spinWheel() {
        if (spinning) return;
        if (sectors.length === 0) {
            updateSectorsFromInput();
            if (sectors.length === 0) return;
        }
        spinning = true;
        document.getElementById('wheelResult').textContent = '...';
        const spinVelocity = Math.random() * 10 + 15;
        const additionalAngle = Math.random() * 2 * Math.PI;
        const targetAngle = wheelAngle + spinVelocity * 3 + additionalAngle;
        const startAngle = wheelAngle;
        const startTime = performance.now();
        const duration = 3000;
        lastTickAngle = startAngle;

        function animate(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOutCubic = 1 - Math.pow(1 - progress, 3);
            const currentAngle = startAngle + (targetAngle - startAngle) * easeOutCubic;
            wheelAngle = currentAngle % (2 * Math.PI);
            drawWheel(wheelAngle);

            // Звук щелчка при пересечении границы сектора
            const arc = (2 * Math.PI) / sectors.length;
            const angleDiff = Math.abs(currentAngle - lastTickAngle);
            if (angleDiff >= arc) {
                playTick();
                lastTickAngle = currentAngle - (angleDiff % arc);
            }

            if (progress < 1) {
                requestAnimationFrame(animate);
            } else {
                const normalizedAngle = ((wheelAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                const pointerAngle = (3 * Math.PI / 2) % (2 * Math.PI);
                let sectorIndex = Math.floor(((pointerAngle - normalizedAngle + 2 * Math.PI) % (2 * Math.PI)) / arc);
                sectorIndex = sectorIndex % sectors.length;
                document.getElementById('wheelResult').textContent = `Выпало: ${sectors[sectorIndex].label}`;
                spinning = false;
            }
        }

        requestAnimationFrame(animate);
    }
</script>

</body>
</html>
