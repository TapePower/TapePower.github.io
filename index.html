<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Охота на Пришельцев</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Убираем прокрутку */
            background-color: #000;
            font-family: Arial, sans-serif;
            color: white;
        }
        /* Прицел в центре экрана */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-top: -10px;
            margin-left: -10px;
            text-align: center;
            line-height: 20px;
            font-size: 24px;
            color: #00ff00;
            pointer-events: none; /* Чтобы не мешал кликать */
            z-index: 10;
        }
        /* Интерфейс счета */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }
        /* Экран паузы/старта */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        #instructions {
            font-size: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="ui">Счет: <span id="scoreVal">0</span></div>

    <div id="blocker">
        <div id="instructions">
            <span style="font-size:40px; font-weight:bold; color: #3498db;">ЗАЩИТНИК ЗЕМЛИ (3D)</span><br><br>
            Кликни мышкой, чтобы начать играть<br><br>
            <b>Управление:</b><br>
            WASD - Ходить<br>
            Мышь - Смотреть вокруг<br>
            ЛКМ (Клик) - Стрелять
        </div>
    </div>

    <script>
        // Основные переменные Three.js
        let camera, scene, renderer, controls;
        let aliens = [];
        let lasers = [];
        let score = 0;
        
        // Управление клавиатурой
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        let prevTime = performance.now();
        let gameActive = false;

        init();
        animate();

        function init() {
            // 1. Создаем сцену
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a2a); // Темно-синий космос
            scene.fog = new THREE.Fog(0x0a0a2a, 0, 50); // Туман вдали

            // 2. Создаем камеру (глаза игрока)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2; // Высота человека

            // 3. Освещение
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            light.position.set(0.5, 1, 0.75);
            scene.add(light);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(20, 20, 20);
            scene.add(dirLight);

            // 4. Земля (Марсианская поверхность)
            const floorGeometry = new THREE.PlaneGeometry(200, 200, 10, 10);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x553333 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 5. Управление (PointerLock - захват мыши)
            controls = new THREE.PointerLockControls(camera, document.body);
            
            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            blocker.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
                blocker.style.display = 'none';
                gameActive = true;
            });

            controls.addEventListener('unlock', function () {
                blocker.style.display = 'flex';
                instructions.style.display = '';
                gameActive = false;
            });

            scene.add(controls.getObject());

            // 6. Слушатели клавиатуры
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            };
            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // 7. Стрельба
            document.addEventListener('mousedown', shoot);

            // 8. Настройка рендерера
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Адаптация под размер окна
            window.addEventListener('resize', onWindowResize);

            // Запускаем спавн пришельцев
            setInterval(spawnAlien, 2000);
        }

        function spawnAlien() {
            if (!gameActive) return;

            // Пришелец - зеленая сфера
            const geometry = new THREE.SphereGeometry(1.5, 16, 16);
            const material = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
            const alien = new THREE.Mesh(geometry, material);

            // Появляются случайно вокруг игрока
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 20;
            
            alien.position.x = controls.getObject().position.x + Math.cos(angle) * radius;
            alien.position.z = controls.getObject().position.z + Math.sin(angle) * radius;
            alien.position.y = 2 + Math.random() * 3; // Парят над землей

            scene.add(alien);
            aliens.push(alien);
        }

        function shoot() {
            if (!gameActive) return;

            // Используем Raycaster для выстрела прямо по центру экрана
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Проверяем попадание
            const intersects = raycaster.intersectObjects(aliens);

            if (intersects.length > 0) {
                const hitAlien = intersects[0].object;
                
                // Удаляем пришельца
                scene.remove(hitAlien);
                aliens = aliens.filter(a => a !== hitAlien);
                
                // Добавляем очки
                score += 10;
                document.getElementById('scoreVal').innerText = score;
            }

            // Визуальный эффект лазера (краткосрочная линия)
            const material = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 });
            const points = [];
            points.push(controls.getObject().position.clone()); // Откуда
            points.push(raycaster.ray.at(50, new THREE.Vector3())); // Куда
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const laser = new THREE.Line(geometry, material);
            scene.add(laser);

            // Удаляем лазер через 0.1 секунды
            setTimeout(() => {
                scene.remove(laser);
            }, 100);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function gameOver() {
            gameActive = false;
            controls.unlock(); // Отпускаем мышку
            document.getElementById('instructions').innerHTML = 
                '<span style="font-size:40px; color:#e74c3c; font-weight:bold;">ВАС СЪЕЛИ!</span><br><br>' +
                'Итоговый счет: ' + score + '<br><br>' +
                'Кликни, чтобы начать заново';
            
            // Очищаем уровень
            aliens.forEach(a => scene.remove(a));
            aliens = [];
            score = 0;
            document.getElementById('scoreVal').innerText = score;
            
            // Возвращаем игрока в центр
            controls.getObject().position.set(0, 2, 0);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (gameActive) {
                // Движение игрока
                const speed = 15 * delta;
                if (moveForward) controls.moveForward(speed);
                if (moveBackward) controls.moveForward(-speed);
                if (moveLeft) controls.moveRight(-speed);
                if (moveRight) controls.moveRight(speed);

                // Ограничиваем карту (чтобы не уйти бесконечно далеко)
                const pos = controls.getObject().position;
                if (pos.x > 95) pos.x = 95;
                if (pos.x < -95) pos.x = -95;
                if (pos.z > 95) pos.z = 95;
                if (pos.z < -95) pos.z = -95;

                // Движение пришельцев
                const playerPos = controls.getObject().position;
                aliens.forEach(alien => {
                    // Пришелец поворачивается к игроку
                    alien.lookAt(playerPos);
                    // И летит к нему (скорость)
                    alien.translateZ(4 * delta); 

                    // Проверка столкновения с игроком (Game Over)
                    if (alien.position.distanceTo(playerPos) < 2) {
                        gameOver();
                    }
                });
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
