<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Shooter 3D</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

#overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #000c18;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 30px;
    cursor: pointer;
    z-index: 10;
}

#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #00ffcc;
    font-size: 20px;
}

#crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 15px;
    height: 15px;
    border: 2px solid #00ffcc;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>

<body>

<div id="overlay">КЛИКНИ ЧТОБЫ НАЧАТЬ</div>
<div id="hud">УБИТО: <span id="kills">0</span></div>
<div id="crosshair"></div>

<script>
let scene, camera, renderer, controls;
let aliens = [];
let kills = 0;
let move = {f:0,b:0,l:0,r:0};
let prevTime = performance.now();

init();

function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101820);

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer();
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1));

    const light = new THREE.PointLight(0xffffff,1);
    light.position.set(0,10,0);
    scene.add(light);

    const grid = new THREE.GridHelper(200,50);
    scene.add(grid);

    controls = new THREE.PointerLockControls(camera, document.body);

    document.getElementById("overlay").onclick = () => {
        controls.lock();
        spawnWave();
    };

    controls.addEventListener("lock", ()=>{
        document.getElementById("overlay").style.display="none";
    });

    controls.addEventListener("unlock", ()=>{
        document.getElementById("overlay").style.display="flex";
    });

    document.addEventListener("keydown", e=>{
        if(e.code==="KeyW") move.f=1;
        if(e.code==="KeyS") move.b=1;
        if(e.code==="KeyA") move.l=1;
        if(e.code==="KeyD") move.r=1;
    });

    document.addEventListener("keyup", e=>{
        if(e.code==="KeyW") move.f=0;
        if(e.code==="KeyS") move.b=0;
        if(e.code==="KeyA") move.l=0;
        if(e.code==="KeyD") move.r=0;
    });

    document.addEventListener("mousedown", shoot);

    animate();
}

function spawnEnemy(){
    const geo = new THREE.BoxGeometry(1,2,1);
    const mat = new THREE.MeshBasicMaterial({color:0xff0000});
    const enemy = new THREE.Mesh(geo, mat);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    const pos = camera.position.clone().add(dir.multiplyScalar(10));

    enemy.position.set(pos.x,0,pos.z);

    scene.add(enemy);
    aliens.push(enemy);
}

function spawnWave(){
    aliens.forEach(a=>scene.remove(a));
    aliens = [];

    for(let i=0;i<5;i++){
        spawnEnemy();
    }
}

function shoot(){
    const ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(0,0), camera);

    const hits = ray.intersectObjects(aliens);

    if(hits.length>0){
        const enemy = hits[0].object;
        scene.remove(enemy);
        aliens = aliens.filter(a=>a!==enemy);

        kills++;
        document.getElementById("kills").innerText = kills;

        spawnEnemy();
    }
}

function animate(){
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime)/1000;

    if(controls.isLocked){
        const speed = 10*delta;

        if(move.f) controls.moveForward(speed);
        if(move.b) controls.moveForward(-speed);
        if(move.l) controls.moveRight(-speed);
        if(move.r) controls.moveRight(speed);

        aliens.forEach(a=>{
            a.lookAt(camera.position);
            a.translateZ(2*delta);

            if(a.position.distanceTo(camera.position)<2){
                alert("ТЕБЯ УБИЛИ");
                location.reload();
            }
        });
    }

    prevTime = time;
    renderer.render(scene, camera);
}

window.onresize = ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
};
</script>

</body>
</html>
