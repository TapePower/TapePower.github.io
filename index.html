<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вторжение: Космический Рубеж 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
            margin: -15px 0 0 -15px; border: 2px solid rgba(0, 255, 0, 0.5);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 28px; color: #0f0; text-shadow: 2px 2px #000; z-index: 10; }
        #blocker {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; text-align: center; color: #0f0; cursor: pointer; z-index: 20;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">ЭНЕРГИЯ: 100% | СЧЕТ: <span id="scoreVal">0</span></div>

    <div id="blocker">
        <div>
            <h1 style="font-size: 50px;">ALIEN INVASION 3D</h1>
            <p>КЛИКНИ, ЧТОБЫ ВСТУПИТЬ В БОЙ</p>
            <p>(WASD - Движение, Мышь - Огонь)</p>
        </div>
    </div>

    <script>
        let camera, scene, renderer, controls, gunGroup, flashLight;
        let aliens = [];
        let score = 0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let gameActive = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205);

            // Добавляем звезды
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({color: 0xffffff});
            const starVertices = [];
            for(let i=0; i<5000; i++) {
                starVertices.push((Math.random()-0.5)*1000, (Math.random()-0.5)*1000, (Math.random()-0.5)*1000);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const light = new THREE.AmbientLight(0x404040, 1); 
            scene.add(light);
            const spotLight = new THREE.PointLight(0x00ff00, 1, 50);
            scene.add(spotLight);

            // Пол (космическая станция)
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshPhongMaterial({color: 0x111111, specular: 0x555555});
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Создаем ОРУЖИЕ
            gunGroup = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(0.5, 0.6, 2);
            const bodyMat = new THREE.MeshPhongMaterial({color: 0x222222});
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            
            const barrelGeo = new THREE.CylinderGeometry(0.15, 0.15, 1);
            const barrelMat = new THREE.MeshPhongMaterial({color: 0x555555});
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.z = -1.2;
            
            flashLight = new THREE.PointLight(0x00ffff, 0, 10);
            flashLight.position.z = -2;
            
            gunGroup.add(body, barrel, flashLight);
            camera.add(gunGroup);
            gunGroup.position.set(0.8, -0.6, -1.5); // Позиция в руках

            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            const blocker = document.getElementById('blocker');
            blocker.addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => { blocker.style.display = 'none'; gameActive = true; });
            controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; gameActive = false; });

            window.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveForward = true;
                if(e.code === 'KeyS') moveBackward = true;
                if(e.code === 'KeyA') moveLeft = true;
                if(e.code === 'KeyD') moveRight = true;
            });
            window.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveForward = false;
                if(e.code === 'KeyS') moveBackward = false;
                if(e.code === 'KeyA') moveLeft = false;
                if(e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousedown', shoot);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            setInterval(spawnAlien, 1500);
        }

        // Функция создания модели ПРИШЕЛЬЦА
        function createAlienModel() {
            const group = new THREE.Group();
            const mat = new THREE.MeshPhongMaterial({color: 0x33ff33});
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), mat);
            body.position.y = 1.5;
            
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat);
            head.position.y = 2.7;
            
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.1, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({color: 0x000000});
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.2, 2.8, 0.4);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.2, 2.8, 0.4);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), mat);
            armL.position.set(-0.7, 1.5, 0);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), mat);
            armR.position.set(0.7, 1.5, 0);

            group.add(body, head, eyeL, eyeR, armL, armR);
            return group;
        }

        function spawnAlien() {
            if(!gameActive) return;
            const alien = createAlienModel();
            const angle = Math.random() * Math.PI * 2;
            const radius = 40;
            alien.position.x = controls.getObject().position.x + Math.cos(angle) * radius;
            alien.position.z = controls.getObject().position.z + Math.sin(angle) * radius;
            scene.add(alien);
            aliens.push(alien);
        }

        function shoot() {
            if(!gameActive) return;

            // Вспышка выстрела
            flashLight.intensity = 2;
            gunGroup.position.z = -1.3; // Отдача

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            // Ищем попадание в любую часть группы пришельца
            const allMesh = [];
            aliens.forEach(a => a.traverse(child => { if(child.isMesh) { child.parentAlien = a; allMesh.push(child); }}));
            
            const intersects = raycaster.intersectObjects(allMesh);
            if (intersects.length > 0) {
                const targetAlien = intersects[0].object.parentAlien;
                scene.remove(targetAlien);
                aliens = aliens.filter(a => a !== targetAlien);
                score += 100;
                document.getElementById('scoreVal').innerText = score;
            }

            setTimeout(() => { flashLight.intensity = 0; gunGroup.position.z = -1.5; }, 50);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if(gameActive) {
                const speed = 20 * delta;
                if(moveForward) controls.moveForward(speed);
                if(moveBackward) controls.moveForward(-speed);
                if(moveLeft) controls.moveRight(-speed);
                if(moveRight) controls.moveRight(speed);

                // Покачивание оружия при ходьбе
                if(moveForward || moveBackward || moveLeft || moveRight) {
                    gunGroup.position.y = -0.6 + Math.sin(time * 0.01) * 0.02;
                    gunGroup.position.x = 0.8 + Math.cos(time * 0.005) * 0.02;
                }

                const playerPos = controls.getObject().position;
                aliens.forEach(alien => {
                    alien.lookAt(playerPos.x, 0, playerPos.z);
                    const dir = new THREE.Vector3().subVectors(playerPos, alien.position).normalize();
                    alien.position.add(dir.multiplyScalar(5 * delta));

                    if(alien.position.distanceTo(playerPos) < 2.5) {
                        gameActive = false;
                        controls.unlock();
                        alert("СТАНЦИЯ ЗАХВАЧЕНА! Твой счет: " + score);
                        location.reload();
                    }
                });
            }
            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
