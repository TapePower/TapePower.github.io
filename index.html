<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON SPACE SHOOTER</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

#overlay {
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle,#020816,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:28px;
    cursor:pointer;
    z-index:10;
}

#hud {
    position:absolute;
    top:20px;
    left:20px;
    color:#00ffcc;
    font-size:18px;
}

#crosshair {
    position:absolute;
    top:50%;
    left:50%;
    width:18px;
    height:18px;
    border:2px solid #00ffcc;
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:0.08s;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>

<body>

<div id="overlay">КЛИК ДЛЯ СТАРТА</div>
<div id="hud">УБИТО: <span id="kills">0</span></div>
<div id="crosshair"></div>

<script>

let scene,camera,renderer,controls;
let enemies=[];
let kills=0;
let move={f:0,b:0,l:0,r:0};
let prev=performance.now();
let cross=document.getElementById("crosshair");

// 🔊 звук
const audioCtx = new (window.AudioContext||window.webkitAudioContext)();

function beep(freq,dur){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.frequency.value=freq;
    osc.type="square";
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+dur);
}

// 🌌 INIT
init();

function init(){

scene=new THREE.Scene();

// 🌌 ЗВЁЗДЫ
const starGeo=new THREE.BufferGeometry();
const starPos=[];

for(let i=0;i<1500;i++){
    starPos.push((Math.random()-0.5)*600);
    starPos.push((Math.random()-0.5)*600);
    starPos.push((Math.random()-0.5)*600);
}

starGeo.setAttribute("position",new THREE.Float32BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff}));
scene.add(stars);

camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.y=2;

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// свет
scene.add(new THREE.AmbientLight(0xffffff,1));

controls=new THREE.PointerLockControls(camera,document.body);

document.getElementById("overlay").onclick=()=>{
    controls.lock();
    spawnWave();
};

document.addEventListener("keydown",e=>{
    if(e.code=="KeyW")move.f=1;
    if(e.code=="KeyS")move.b=1;
    if(e.code=="KeyA")move.l=1;
    if(e.code=="KeyD")move.r=1;
});

document.addEventListener("keyup",e=>{
    if(e.code=="KeyW")move.f=0;
    if(e.code=="KeyS")move.b=0;
    if(e.code=="KeyA")move.l=0;
    if(e.code=="KeyD")move.r=0;
});

document.addEventListener("mousedown",shoot);

animate();
}

// 👾 ВРАГ
function enemy(){

const g=new THREE.Group();

const body=new THREE.Mesh(
    new THREE.SphereGeometry(1,12,12),
    new THREE.MeshBasicMaterial({color:0xff0033})
);

const glow=new THREE.PointLight(0xff0033,2,10);
g.add(body);
g.add(glow);

// ВСЕГДА ПЕРЕД ИГРОКОМ
const dir=new THREE.Vector3();
camera.getWorldDirection(dir);

const pos=camera.position.clone().add(dir.multiplyScalar(12));

pos.x+=(Math.random()-0.5)*6;
pos.z+=(Math.random()-0.5)*6;

g.position.copy(pos);
g.position.y=1;

scene.add(g);
enemies.push(g);

}

// волна
function spawnWave(){
enemies.forEach(e=>scene.remove(e));
enemies=[];

for(let i=0;i<6;i++){
enemy();
}
}

// 🔫 стрельба
function shoot(){

cross.style.transform="translate(-50%,-50%) scale(1.6)";
setTimeout(()=>cross.style.transform="translate(-50%,-50%) scale(1)",80);

beep(400,0.05);

const ray=new THREE.Raycaster();
ray.setFromCamera({x:0,y:0},camera);

const hits=ray.intersectObjects(enemies,true);

if(hits.length>0){
const obj=hits[0].object.parent;

scene.remove(obj);
enemies=enemies.filter(e=>e!==obj);

kills++;
document.getElementById("kills").innerText=kills;

beep(120,0.1);

enemy();
}
}

// 🎮 LOOP
function animate(){
requestAnimationFrame(animate);

let t=performance.now();
let d=(t-prev)/1000;

if(controls.isLocked){

let sp=10*d;

if(move.f)controls.moveForward(sp);
if(move.b)controls.moveForward(-sp);
if(move.l)controls.moveRight(-sp);
if(move.r)controls.moveRight(sp);

// 👾 AI
enemies.forEach(e=>{
    e.lookAt(camera.position);
    e.translateZ(1.2*d);

    if(e.position.distanceTo(camera.position)<1.5){
        alert("ТЫ УМЕР");
        location.reload();
    }
});

}

prev=t;
renderer.render(scene,camera);
}

window.onresize=()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
};

</script>

</body>
</html>
