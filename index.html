<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический Защитник</title>
    <style>
        /* Стили для оформления страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 5px;
        }
        .instructions {
            margin-bottom: 20px;
            font-size: 16px;
            color: #bdc3c7;
        }
        /* Стили для игрового поля */
        canvas {
            background-color: #000;
            border: 4px solid #34495e;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .btn-restart {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            display: none; /* Скрыта до проигрыша */
        }
        .btn-restart:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <h1>Космический Защитник</h1>
    <div class="instructions">Управление: <b>Стрелки ВЛЕВО/ВПРАВО</b> — движение. <b>ПРОБЕЛ</b> — выстрел.</div>
    
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <button id="restartBtn" class="btn-restart" onclick="resetGame()">Играть снова</button>

    <script>
        // Получаем доступ к холсту (игровому полю)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restartBtn');

        // Игровые переменные
        let score = 0;
        let gameOver = false;

        // Объекты игры
        let player = { x: 175, y: 440, width: 50, height: 40, speed: 6, dx: 0 };
        let bullets = [];
        let enemies = [];

        // Управление клавиатурой
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') player.dx = -player.speed;
            if (e.code === 'ArrowRight') player.dx = player.speed;
            if (e.code === 'Space' && !gameOver) {
                // Создаем пулю по центру игрока
                bullets.push({ 
                    x: player.x + player.width / 2 - 2.5, 
                    y: player.y, 
                    width: 5, 
                    height: 15, 
                    speed: 8 
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') player.dx = 0;
        });

        // Функция появления врагов
        function spawnEnemy() {
            if (Math.random() < 0.04) { // Вероятность появления врага в каждом кадре
                let size = 30 + Math.random() * 20; // Случайный размер
                enemies.push({ 
                    x: Math.random() * (canvas.width - size), 
                    y: -size, 
                    width: size, 
                    height: size, 
                    speed: 2 + Math.random() * 2 // Случайная скорость
                });
            }
        }

        // Перезапуск игры
        function resetGame() {
            score = 0;
            gameOver = false;
            player.x = 175;
            bullets = [];
            enemies = [];
            restartBtn.style.display = 'none';
            loop(); // Снова запускаем игровой цикл
        }

        // Обновление логики (движение, столкновения)
        function update() {
            if (gameOver) return;

            // Движение игрока
            player.x += player.dx;
            // Не даем игроку вылететь за границы
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Движение пуль
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1); // Удаляем пули, улетевшие за экран
            });

            // Появление и движение врагов
            spawnEnemy();
            enemies.forEach((e, eIndex) => {
                e.y += e.speed;

                // Столкновение врага с игроком (Конец игры)
                if (e.x < player.x + player.width && e.x + e.width > player.x &&
                    e.y < player.y + player.height && e.y + e.height > player.y) {
                    gameOver = true;
                }

                // Столкновение пули с врагом
                bullets.forEach((b, bIndex) => {
                    if (b.x < e.x + e.width && b.x + b.width > e.x &&
                        b.y < e.y + e.height && b.y + b.height > e.y) {
                        
                        // Удаляем врага и пулю, прибавляем очки
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                    }
                });

                // Удаляем врагов, пролетевших мимо экрана
                if (e.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                }
            });
        }

        // Отрисовка графики
        function draw() {
            // Очищаем экран каждый кадр
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = '#e74c3c';
                ctx.font = 'bold 40px Arial';
                ctx.fillText('ИГРА ОКОНЧЕНА', 25, canvas.height / 2 - 20);
                
                ctx.fillStyle = 'white';
                ctx.font = '24px Arial';
                ctx.fillText('Ваш счет: ' + score, 130, canvas.height / 2 + 20);
                
                restartBtn.style.display = 'block'; // Показываем кнопку рестарта
                return;
            }

            // Рисуем игрока (синий прямоугольник)
            ctx.fillStyle = '#3498db';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Рисуем пули (желтые)
            ctx.fillStyle = '#f1c40f';
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Рисуем врагов (красные)
            ctx.fillStyle = '#e74c3c';
            enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));

            // Рисуем счет
            ctx.fillStyle = '#ecf0f1';
            ctx.font = '20px Arial';
            ctx.fillText('Счет: ' + score, 15, 30);
        }

        // Главный игровой цикл
        function loop() {
            update();
            draw();
            if (!gameOver) {
                requestAnimationFrame(loop); // Запрашиваем следующий кадр анимации
            }
        }

        // Запуск игры
        loop();
    </script>
</body>
</html>
