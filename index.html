<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Solver Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --primary: #8b5cf6;
            --accent: #06b6d4;
            --grad: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text: #0f172a;
            --primary: #6366f1;
            --accent: #0ea5e9;
        }

        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 { margin: 0; font-weight: 800; letter-spacing: -1px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        input {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            color: var(--text);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        [data-theme="light"] input { background: #fff; }

        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }

        .btn-solve {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: var(--grad);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-solve:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); }

        .root-box {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .root-item {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .fraction {
            text-align: center;
            font-size: 0.95rem;
            min-width: 150px;
        }

        .num { border-bottom: 1px solid var(--text); padding: 2px 10px; }
        .den { padding: 2px 10px; }

        .val { font-family: 'Monaco', monospace; color: var(--accent); font-weight: 600; font-size: 1.1rem; }

        .chart-wrap { height: 300px; margin-top: 30px; }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .history-item:hover { opacity: 1; background: rgba(255,255,255,0.03); }

        .theme-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .author-tag {
            position: fixed;
            bottom: 25px;
            right: 25px;
            font-weight: 900;
            font-size: 1.4rem;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }
    </style>
</head>
<body data-theme="dark" oncontextmenu="return false;">

<div class="container">
    <div class="left-side">
        <div class="glass-card">
            <div class="header">
                <h1>SOLVER PRO</h1>
                <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
            </div>
            
            <div class="input-group">
                <input type="number" id="a" placeholder="a" step="any">
                <input type="number" id="b" placeholder="b" step="any">
                <input type="number" id="c" placeholder="c" step="any">
            </div>
            
            <button class="btn-solve" onclick="calculate()">Вычислить решение</button>

            <div id="res-area" class="root-box"></div>

            <div class="chart-wrap">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </div>

    <div class="right-side">
        <div class="glass-card" style="height: 100%;">
            <h3 style="margin: 0; color: var(--primary);">История запросов</h3>
            <div id="h-list" class="history-list"></div>
            <button onclick="clearHistory()" style="margin-top: 20px; background: none; border: none; color: #ff4757; cursor: pointer; font-size: 0.8rem;">Очистить всё</button>
        </div>
    </div>
</div>

<div class="author-tag">by TapePower</div>

<script>
    // Блокировка просмотра кода
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
            return false;
        }
    };

    let chart = null;
    let historyData = JSON.parse(localStorage.getItem('eq_history')) || [];

    window.onload = () => { renderHistory(); };

    function toggleTheme() {
        const b = document.body;
        const t = b.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        b.setAttribute('data-theme', t);
        if(chart) calculate(); // Обновить цвета графика
    }

    function calculate() {
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const c = parseFloat(document.getElementById('c').value);

        if (isNaN(a) || a === 0) return;

        const D = b * b - 4 * a * c;
        const area = document.getElementById('res-area');
        area.innerHTML = `<div style="font-weight: 600;">Дискриминант D = ${D}</div>`;

        let roots = [];
        if (D > 0) {
            const x1 = (-b + Math.sqrt(D)) / (2 * a);
            const x2 = (-b - Math.sqrt(D)) / (2 * a);
            area.innerHTML += drawRoot("x₁", `-${b} + √${D}`, 2*a, x1);
            area.innerHTML += drawRoot("x₂", `-${b} - √${D}`, 2*a, x2);
            roots = [x1, x2];
        } else if (D === 0) {
            const x = -b / (2 * a);
            area.innerHTML += drawRoot("x", `-${b}`, 2*a, x);
            roots = [x];
        } else {
            area.innerHTML += `<div style="color: #ff4757;">Корней нет</div>`;
        }

        updateChart(a, b, c, roots);
        saveToHistory(a, b, c, roots);
    }

    function drawRoot(name, n, d, v) {
        return `
            <div class="root-item">
                <span style="color: var(--primary); font-weight: 800;">${name}</span>
                <div class="fraction">
                    <div class="num">${n}</div>
                    <div class="den">${d}</div>
                </div>
                <span style="font-weight: 300;">≈</span>
                <div class="val">${v.toFixed(10)}</div>
            </div>
        `;
    }

    function updateChart(a, b, c, roots) {
        const ctx = document.getElementById('chart').getContext('2d');
        const mid = -b / (2 * a);
        const labels = [], data = [];
        for(let x = mid-5; x <= mid+5; x += 0.2) {
            labels.push(x.toFixed(1));
            data.push(a*x*x + b*x + c);
        }

        if(chart) chart.destroy();
        const isDark = document.body.getAttribute('data-theme') === 'dark';

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    borderColor: '#8b5cf6',
                    borderWidth: 3,
                    pointRadius: 0,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: isDark ? '#64748b' : '#94a3b8' }, grid: { display: false } },
                    y: { ticks: { color: isDark ? '#64748b' : '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function saveToHistory(a, b, c, r) {
        const entry = {
            q: `${a}x² ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c} = 0`,
            a: r.length ? r.map(n => n.toFixed(4)).join('; ') : 'нет корней'
        };
        historyData.unshift(entry);
        if(historyData.length > 20) historyData.pop();
        localStorage.setItem('eq_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('h-list');
        list.innerHTML = historyData.map(i => `
            <div class="history-item">
                <div style="font-weight: 600; color: var(--text);">${i.q}</div>
                <div style="color: var(--accent); margin-top: 5px;">Ответ: ${i.a}</div>
            </div>
        `).join('');
    }

    function clearHistory() {
        localStorage.removeItem('eq_history');
        historyData = [];
        renderHistory();
    }
</script>

</body>
</html>
