<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Генератор заданий</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#74b9ff,#a29bfe);
    color: #fff;
    text-align: center;
    padding: 50px;
}

.card {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 15px;
    display: inline-block;
    width: 350px;
}

input, select {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #00cec9;
    color: white;
    font-weight: bold;
}

#result {
    margin-top: 20px;
    font-size: 18px;
    background: rgba(255,255,255,0.2);
    padding: 15px;
    border-radius: 10px;
}
</style>

</head>
<body>

<h1>📚 Генератор школьных заданий</h1>

<div class="card">

    <input id="classInput" type="number" placeholder="Введите класс (1-11)">

    <select id="subject">
        <option value="math">Математика</option>
        <option value="russian">Русский язык</option>
        <option value="physics">Физика</option>
        <option value="history">История</option>
    </select>

    <button onclick="generateTask()">Получить задание</button>

    <div id="result">Здесь появится задание</div>

</div>

<script>
const tasks = {
    math: {
        5: [
            "Реши: 125 + 378",
            "Найди периметр квадрата со стороной 7 см",
            "Сколько будет 12 × 9?"
        ],
        9: [
            "Реши квадратное уравнение: x² - 5x + 6 = 0",
            "Найди дискриминант уравнения 2x² + 3x - 2 = 0"
        ]
    },

    russian: {
        5: [
            "Разбери слово по составу: 'лесник'",
            "Найди подлежащее и сказуемое в предложении"
        ],
        9: [
            "Напиши сочинение на тему 'Моя цель в жизни'",
            "Определи тип придаточного предложения"
        ]
    },

    physics: {
        7: [
            "Найди силу тяжести тела массой 5 кг",
            "Объясни закон Архимеда"
        ],
        9: [
            "Реши задачу на закон Ома",
            "Найди ускорение тела при F=20Н, m=4кг"
        ]
    },

    history: {
        6: [
            "Назови причины падения Римской империи",
            "Кто такой Юлий Цезарь?"
        ],
        9: [
            "Объясни причины Первой мировой войны",
            "Расскажи о революции 1917 года"
        ]
    }
};

function generateTask() {
    const cls = document.getElementById("classInput").value;
    const subject = document.getElementById("subject").value;

    if (!cls) {
        document.getElementById("result").innerText = "Введите класс!";
        return;
    }

    const subjectData = tasks[subject];

    if (!subjectData || !subjectData[cls]) {
        document.getElementById("result").innerText =
            "Нет заданий для этого класса и предмета 😢";
        return;
    }

    const list = subjectData[cls];
    const randomTask = list[Math.floor(Math.random() * list.length)];

    document.getElementById("result").innerText = randomTask;
}
</script>

</body>
</html>
