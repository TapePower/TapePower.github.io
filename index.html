<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Open Task Generator</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 40px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    display: inline-block;
    width: 350px;
}

input, select {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 10px;
    width: 95%;
    cursor: pointer;
    background: #38bdf8;
    border: none;
    font-weight: bold;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: #334155;
    border-radius: 10px;
}
</style>

</head>
<body>

<h1>📚 Open Task Generator (API)</h1>

<div class="card">

<input id="classInput" placeholder="Класс (например 7)">
<select id="subject">
    <option value="math">Математика</option>
    <option value="physics">Физика</option>
    <option value="russian">Русский</option>
</select>

<button onclick="getTask()">Получить задание</button>

<div id="result">Задание появится здесь</div>

</div>

<script>

async function getTask() {
    const cls = document.getElementById("classInput").value;
    const subject = document.getElementById("subject").value;

    if (!cls) {
        document.getElementById("result").innerText = "Введите класс!";
        return;
    }

    // 🌐 ОТКРЫТЫЙ JSON (как API)
    const url = "https://raw.githubusercontent.com/tapepower/open-tasks/main/tasks.json";

    try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data[subject] || !data[subject][cls]) {
            document.getElementById("result").innerText =
                "Нет данных для этого класса 😢";
            return;
        }

        const tasks = data[subject][cls];
        const random = tasks[Math.floor(Math.random() * tasks.length)];

        document.getElementById("result").innerText = random;

    } catch (e) {
        document.getElementById("result").innerText =
            "Ошибка загрузки данных API";
    }
}

</script>

</body>
</html>
