<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tapepower Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      display: block;
      background: linear-gradient(180deg, #10182f 0%, #0b1020 100%);
    }

    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-size: 14px;
      line-height: 1.5;
    }

    .center {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .panel {
      background: rgba(10, 16, 32, 0.95);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 24px;
      border-radius: 18px;
      width: min(420px, calc(100vw - 32px));
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .panel p {
      margin: 8px 0;
      color: #c9d2ff;
    }

    .btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: #5b7cff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .btn:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">
    <div>Очки: <span id="score">0</span></div>
    <div>Жизни: <span id="lives">3</span></div>
    <div>Управление: WASD / стрелки, пробел или мышь — стрелять</div>
  </div>

  <div class="center" id="gameOver">
    <div class="panel">
      <h1>Игра окончена</h1>
      <p>Ваш счёт: <span id="finalScore">0</span></p>
      <button class="btn" onclick="restartGame()">Играть снова</button>
    </div>
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const gameOverEl = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const keys = {};
    window.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === " ") e.preventDefault();
    });
    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    const mouse = { x: 0, y: 0, down: false };

    canvas.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener("mousedown", () => mouse.down = true);
    canvas.addEventListener("mouseup", () => mouse.down = false);

    const player = {
      x: 100,
      y: 100,
      w: 28,
      h: 28,
      speed: 4.5,
      fireCooldown: 0,
      lives: 3
    };

    let bullets = [];
    let enemies = [];
    let score = 0;
    let running = true;
    let enemySpawnTimer = 0;
    let enemySpawnDelay = 60;

    function restartGame() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.lives = 3;
      bullets = [];
      enemies = [];
      score = 0;
      running = true;
      enemySpawnTimer = 0;
      enemySpawnDelay = 60;
      gameOverEl.style.display = "none";
      updateHud();
      requestAnimationFrame(loop);
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = player.lives;
    }

    function shoot(targetX, targetY) {
      if (player.fireCooldown > 0) return;

      const dx = targetX - (player.x + player.w / 2);
      const dy = targetY - (player.y + player.h / 2);
      const len = Math.hypot(dx, dy) || 1;

      const speed = 9;
      bullets.push({
        x: player.x + player.w / 2,
        y: player.y + player.h / 2,
        vx: (dx / len) * speed,
        vy: (dy / len) * speed,
        r: 4
      });

      player.fireCooldown = 12;
    }

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;

      if (side === 0) { x = 0; y = Math.random() * canvas.height; }
      if (side === 1) { x = canvas.width; y = Math.random() * canvas.height; }
      if (side === 2) { x = Math.random() * canvas.width; y = 0; }
      if (side === 3) { x = Math.random() * canvas.width; y = canvas.height; }

      enemies.push({
        x, y,
        w: 26,
        h: 26,
        speed: 1.2 + Math.random() * 1.3,
        hp: 1
      });
    }

    function drawPlayer() {
      ctx.fillStyle = "#6cf";
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = "#fff";
      ctx.fillRect(player.x + 8, player.y + 8, 4, 4);
      ctx.fillRect(player.x + 16, player.y + 8, 4, 4);
    }

    function drawBullet(b) {
      ctx.beginPath();
      ctx.fillStyle = "#ffd166";
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawEnemy(e) {
      ctx.fillStyle = "#ff5c7a";
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = "#fff";
      ctx.fillRect(e.x + 6, e.y + 7, 4, 4);
      ctx.fillRect(e.x + 16, e.y + 7, 4, 4);
    }

    function aabb(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function loop() {
      if (!running) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let dx = 0, dy = 0;
      if (keys["w"] || keys["arrowup"]) dy -= 1;
      if (keys["s"] || keys["arrowdown"]) dy += 1;
      if (keys["a"] || keys["arrowleft"]) dx -= 1;
      if (keys["d"] || keys["arrowright"]) dx += 1;

      const len = Math.hypot(dx, dy) || 1;
      player.x += (dx / len) * player.speed;
      player.y += (dy / len) * player.speed;

      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

      if (player.fireCooldown > 0) player.fireCooldown--;

      if (mouse.down || keys[" "]) {
        shoot(mouse.x, mouse.y);
      }

      if (enemySpawnTimer <= 0) {
        spawnEnemy();
        enemySpawnTimer = enemySpawnDelay;
        if (enemySpawnDelay > 20) enemySpawnDelay -= 0.15;
      } else {
        enemySpawnTimer--;
      }

      bullets.forEach((b) => {
        b.x += b.vx;
        b.y += b.vy;
      });
      bullets = bullets.filter((b) =>
        b.x > -20 && b.x < canvas.width + 20 && b.y > -20 && b.y < canvas.height + 20
      );

      enemies.forEach((e) => {
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        const ex = e.x + e.w / 2;
        const ey = e.y + e.h / 2;
        const ang = Math.atan2(py - ey, px - ex);
        e.x += Math.cos(ang) * e.speed;
        e.y += Math.sin(ang) * e.speed;
      });

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const hit = (
            b.x > e.x && b.x < e.x + e.w &&
            b.y > e.y && b.y < e.y + e.h
          );

          if (hit) {
            bullets.splice(j, 1);
            enemies.splice(i, 1);
            score++;
            updateHud();
            break;
          }
        }
      }

      enemies.forEach((e, i) => {
        if (aabb(player, e)) {
          enemies.splice(i, 1);
          player.lives--;
          updateHud();

          if (player.lives <= 0) {
            running = false;
            finalScoreEl.textContent = score;
            gameOverEl.style.display = "flex";
          }
        }
      });

      drawPlayer();
      bullets.forEach(drawBullet);
      enemies.forEach(drawEnemy);

      requestAnimationFrame(loop);
    }

    updateHud();
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    loop();
  </script>
</body>
</html>
