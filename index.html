<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xeno-Hunter: The Final Stand</title>
  <style>
    :root {
      --neon: #00ffcc;
      --dark: #03060b;
      --panel: rgba(0, 20, 30, 0.75);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #0b1b2f 0%, #03060b 60%, #000 100%);
      font-family: 'Courier New', monospace;
      color: white;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(0,255,204,0.08), transparent 40%),
        radial-gradient(circle at top, rgba(0,120,255,0.12), transparent 35%),
        linear-gradient(180deg, rgba(4,10,20,0.92), rgba(1,4,8,0.98));
      backdrop-filter: blur(6px);
    }

    #overlay h1 {
      color: var(--neon);
      letter-spacing: 5px;
      text-shadow: 0 0 18px rgba(0,255,204,0.75);
      margin: 0 0 8px;
      font-size: 42px;
    }

    #overlay p {
      margin: 0 0 20px;
      opacity: 0.9;
      letter-spacing: 2px;
    }

    #level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      padding: 16px;
      background: rgba(0,0,0,0.15);
      border: 1px solid rgba(0,255,204,0.18);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0,255,204,0.08);
    }

    .level-card {
      width: 64px;
      height: 64px;
      background: rgba(0,255,204,0.08);
      border: 2px solid var(--neon);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.25s;
      user-select: none;
    }

    .level-card:hover:not(.locked) {
      background: var(--neon);
      color: black;
      box-shadow: 0 0 20px var(--neon);
      transform: translateY(-2px) scale(1.04);
    }

    .level-card.locked {
      opacity: 0.18;
      cursor: not-allowed;
      border-color: #666;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid rgba(0,255,204,0.2);
      color: var(--neon);
      font-size: 20px;
      text-shadow: 0 0 10px rgba(0,255,204,0.45);
      pointer-events: none;
      box-shadow: 0 0 25px rgba(0,255,204,0.08);
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      border: 2px solid var(--neon);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 0 12px rgba(0,255,204,0.6);
    }

    #hint {
      margin-top: 18px;
      opacity: 0.8;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      max-width: 540px;
      padding: 0 16px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="overlay">
    <h1>XENO-HUNTER 3D</h1>
    <p>ВЫБЕРИТЕ УРОВЕНЬ</p>
    <div id="level-grid"></div>
    <div id="hint">WASD — движение · Мышь — обзор · ЛКМ — выстрел</div>
  </div>

  <div id="hud">
    УРОВЕНЬ: <span id="cur-lvl">1</span> |
    УБИТО: <span id="kills">0</span> / <span id="req-kills">5</span>
  </div>

  <div id="crosshair"></div>

  <script>
    let scene, camera, renderer, controls, gun, flash;
    let aliens = [];
    let stars = [];
    let gameActive = false;
    let currentLevel = 1;
    let killsCount = 0;
    let requiredKills = 5;
    let unlockedLevel = parseInt(localStorage.getItem('xh_reached')) || 1;
    let moveState = { f: false, b: false, l: false, r: false };
    let prevTime = performance.now();
    let spawnTimer = null;

    function buildMenu() {
      const grid = document.getElementById('level-grid');
      grid.innerHTML = '';

      for (let i = 1; i <= 20; i++) {
        const card = document.createElement('div');
        card.className = `level-card ${i > unlockedLevel ? 'locked' : ''}`;
        card.innerText = i;
        card.onclick = () => {
          if (i <= unlockedLevel) startGame(i);
        };
        grid.appendChild(card);
      }
    }

    function startGame(lvl) {
      currentLevel = lvl;
      killsCount = 0;
      requiredKills = 3 + (lvl * 2);

      document.getElementById('cur-lvl').innerText = lvl;
      document.getElementById('req-kills').innerText = requiredKills;
      document.getElementById('kills').innerText = 0;
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('hud').style.display = 'block';

      if (!scene) initThree();

      aliens.forEach(a => scene.remove(a));
      aliens = [];

      gameActive = true;
      controls.lock();

      spawnAlien(18);

      if (spawnTimer) clearInterval(spawnTimer);
      spawnTimer = setInterval(() => {
        if (gameActive && aliens.length < 4 + currentLevel) {
          spawnAlien();
        }
      }, 1800);
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x02040a);
      scene.fog = new THREE.Fog(0x02040a, 10, 90);

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));

      const moonLight = new THREE.DirectionalLight(0x88bbff, 0.8);
      moonLight.position.set(30, 50, 20);
      scene.add(moonLight);

      const neonLight = new THREE.PointLight(0x00ffcc, 1.5, 60);
      neonLight.position.set(0, 5, 0);
      scene.add(neonLight);

      const grid = new THREE.GridHelper(500, 60, 0x00ffcc, 0x062030);
      grid.position.y = 0;
      scene.add(grid);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 500),
        new THREE.MeshStandardMaterial({
          color: 0x071018,
          roughness: 1,
          metalness: 0
        })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      floor.position.y = -0.02;
      scene.add(floor);

      createStars();

      gun = new THREE.Group();
      const gBody = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 0.22, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.7, roughness: 0.4 })
      );
      const gTip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.08, 0.25, 10),
        new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.25 })
      );
      gTip.rotation.x = Math.PI / 2;
      gTip.position.z = -0.58;

      const gFlash = new THREE.PointLight(0x00ffcc, 0, 6);
      gFlash.position.z = -0.65;

      gun.add(gBody, gTip, gFlash);
      flash = gFlash;
      gun.position.set(0.5, -0.35, -0.7);
      camera.add(gun);
      scene.add(camera);

      controls = new THREE.PointerLockControls(camera, document.body);

      controls.addEventListener('unlock', () => {
        gameActive = false;
        document.getElementById('overlay').style.display = 'flex';
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveState.f = true;
        if (e.code === 'KeyS') moveState.b = true;
        if (e.code === 'KeyA') moveState.l = true;
        if (e.code === 'KeyD') moveState.r = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveState.f = false;
        if (e.code === 'KeyS') moveState.b = false;
        if (e.code === 'KeyA') moveState.l = false;
        if (e.code === 'KeyD') moveState.r = false;
      });

      document.addEventListener('mousedown', shoot);

      animate();
    }

    function createStars() {
      const starGeo = new THREE.BufferGeometry();
      const starCount = 1200;
      const positions = [];

      for (let i = 0; i < starCount; i++) {
        const x = (Math.random() - 0.5) * 700;
        const y = Math.random() * 300 + 20;
        const z = (Math.random() - 0.5) * 700;
        positions.push(x, y, z);
      }

      starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.8,
        sizeAttenuation: true
      });

      const starsPoints = new THREE.Points(starGeo, starMat);
      scene.add(starsPoints);
      stars.push(starsPoints);
    }

    function spawnAlien(forcedDist) {
      const group = new THREE.Group();

      const mat = new THREE.MeshStandardMaterial({
        color: 0x2dff2d,
        emissive: 0x11aa11,
        emissiveIntensity: 0.7,
        roughness: 0.35,
        metalness: 0.2
      });

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.55, 1.1, 5, 10),
        mat
      );
      body.position.y = 1;
      body.castShadow = true;

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 12, 12),
        mat
      );
      head.position.y = 2.1;
      head.castShadow = true;

      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2b2b });
      const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
      const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
      eye1.position.set(-0.14, 2.15, 0.34);
      eye2.position.set(0.14, 2.15, 0.34);

      const glow = new THREE.PointLight(0x00ff66, 0.7, 8);
      glow.position.y = 1.2;

      group.add(body, head, eye1, eye2, glow);

      const camPos = camera.position.clone();
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);

      if (forcedDist) {
        group.position.copy(camPos).add(dir.multiplyScalar(forcedDist));
      } else {
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 18;
        group.position.set(
          camPos.x + Math.cos(angle) * dist,
          0,
          camPos.z + Math.sin(angle) * dist
        );
      }

      group.position.y = 0;
      group.lookAt(camera.position.x, 0, camera.position.z);

      scene.add(group);
      aliens.push(group);
    }

    function shoot() {
      if (!gameActive) return;

      flash.intensity = 5;
      gun.position.z = -0.55;

      const ray = new THREE.Raycaster();
      ray.setFromCamera(new THREE.Vector2(0, 0), camera);

      const targets = [];
      aliens.forEach(a => {
        a.children.forEach(child => {
          child.mainParent = a;
          targets.push(child);
        });
      });

      const hits = ray.intersectObjects(targets, false);

      if (hits.length > 0) {
        const killed = hits[0].object.mainParent;
        scene.remove(killed);
        aliens = aliens.filter(a => a !== killed);

        killsCount++;
        document.getElementById('kills').innerText = killsCount;

        if (killsCount >= requiredKills) {
          unlockedLevel = Math.max(unlockedLevel, currentLevel + 1);
          localStorage.setItem('xh_reached', unlockedLevel);

          gameActive = false;
          alert('УРОВЕНЬ ПРОЙДЕН!');
          controls.unlock();
          buildMenu();
        }
      }

      setTimeout(() => {
        flash.intensity = 0;
        gun.position.z = -0.7;
      }, 60);
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      if (gameActive) {
        const speed = 12 * delta;

        if (moveState.f) controls.moveForward(speed);
        if (moveState.b) controls.moveForward(-speed);
        if (moveState.l) controls.moveRight(-speed);
        if (moveState.r) controls.moveRight(speed);

        aliens.forEach(a => {
          a.lookAt(camera.position.x, 0, camera.position.z);
          const aSpeed = (3.5 + currentLevel * 0.35) * delta;
          a.translateZ(aSpeed);

          if (a.position.distanceTo(camera.position) < 2.2) {
            gameActive = false;
            alert('ВАС СЪЕЛИ!');
            location.reload();
          }
        });
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    buildMenu();

    window.addEventListener('resize', () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
