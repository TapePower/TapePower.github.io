<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Космический Страж — 3D Шутер</title>
    <style>
        :root {
            --hud-bg: rgba(0, 0, 0, 0.7);
            --hud-text: #00ffcc;
            --hud-warn: #ff4444;
            --hud-gold: #ffaa00;
            --hud-blue: #44aaff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000010;
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            cursor: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gameCanvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Прицел */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            width: 40px;
            height: 40px;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 1px;
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }
        #crosshair .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ff3333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ff0000, 0 0 20px #ff4444;
        }

        /* HUD */
        #hud {
            position: fixed;
            z-index: 20;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #scorePanel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-text);
            border-radius: 10px;
            padding: 14px 20px;
            color: var(--hud-text);
            font-size: 16px;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
        }
        #scorePanel .scoreVal {
            font-size: 38px;
            font-weight: bold;
            display: block;
            color: #fff;
            text-shadow: 0 0 15px #00ffcc;
        }
        #healthBar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-warn);
            border-radius: 10px;
            padding: 12px 18px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
            min-width: 180px;
        }
        #healthBar .label {
            color: #ff8888;
            font-size: 13px;
            letter-spacing: 2px;
        }
        #healthFill {
            height: 14px;
            background: linear-gradient(90deg, #ff0000, #ff4444, #ff6666);
            border-radius: 7px;
            margin-top: 6px;
            transition: width 0.3s ease;
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.5);
            width: 100%;
        }
        #healthText {
            color: #fff;
            font-size: 12px;
            text-align: right;
            margin-top: 4px;
        }
        #levelPanel {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: var(--hud-bg);
            border: 1px solid var(--hud-blue);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--hud-blue);
            font-size: 14px;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
            text-align: center;
            box-shadow: 0 0 20px rgba(68, 170, 255, 0.3);
        }
        #levelPanel .lvlNum {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            display: block;
            text-shadow: 0 0 20px #44aaff;
        }
        #weaponPanel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--hud-bg);
            border: 1px solid var(--hud-gold);
            border-radius: 10px;
            padding: 10px 20px;
            color: var(--hud-gold);
            font-size: 13px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.3);
            display: flex;
            gap: 16px;
            align-items: center;
        }
        #weaponPanel .wpName {
            color: #fff;
            font-weight: bold;
            font-size: 15px;
        }
        #enemyCount {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: var(--hud-bg);
            border: 1px solid #ff8800;
            border-radius: 10px;
            padding: 10px 18px;
            color: #ff8800;
            font-size: 13px;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.3);
        }
        #messageOverlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 52px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 0 40px #00ffcc, 0 0 80px #0088ff;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #messageOverlay.visible {
            opacity: 1;
        }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            pointer-events: auto;
        }
        #gameOverScreen.active {
            display: flex;
        }
        #gameOverScreen h1 {
            font-size: 60px;
            color: #ff3333;
            letter-spacing: 6px;
            text-shadow: 0 0 50px #ff0000;
            margin-bottom: 20px;
        }
        #gameOverScreen .finalScore {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }
        #gameOverScreen button {
            padding: 16px 50px;
            font-size: 22px;
            font-family: inherit;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        #gameOverScreen button:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 40px #00ffcc;
        }
        #comboDisplay {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            color: #ffaa00;
            letter-spacing: 2px;
            text-shadow: 0 0 20px #ffaa00;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }
        #lowHealthWarning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 8px solid transparent;
            pointer-events: none;
            z-index: 15;
            animation: pulse 0.8s infinite;
            display: none;
            border-color: rgba(255, 0, 0, 0.6);
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.3);
        }
    </style>
</head>

        // ==================== ЗВУКОВАЯ СИСТЕМА ====================
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.initialized = false;
                this.bgOscillators = [];
                this.bgGain = null;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0.35;
                    this.masterGain.connect(this.ctx.destination);
                    this.initialized = true;
                    this.startBackgroundHum();
                } catch (e) {
                    console.warn('Web Audio API недоступен:', e);
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startBackgroundHum() {
                if (!this.ctx || this.bgOscillators.length > 0) return;
                this.bgGain = this.ctx.createGain();
                this.bgGain.gain.value = 0.025;
                this.bgGain.connect(this.masterGain);
                const freqs = [55, 82, 110];
                freqs.forEach(f => {
                    const osc = this.ctx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const lfo = this.ctx.createOscillator();
                    lfo.frequency.value = 0.3 + Math.random() * 0.5;
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.value = 2;
                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    lfo.start();
                    osc.connect(this.bgGain);
                    osc.start();
                    this.bgOscillators.push({ osc, lfo });
                });
            }

            stopBackgroundHum() {
                this.bgOscillators.forEach(({ osc, lfo }) => {
                    try { osc.stop();
                        lfo.stop(); } catch (e) {}
                });
                this.bgOscillators = [];
                if (this.bgGain) {
                    this.bgGain.disconnect();
                    this.bgGain = null;
                }
            }

            playSound(type, params = {}) {
                if (!this.ctx || !this.initialized) return;
                this.resume();
                const now = this.ctx.currentTime;
                switch (type) {
                    case 'shoot': {
                        const freq = params.freq || 800;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now);
                        osc.frequency.exponentialRampToValueAtTime(freq * 0.25, now + 0.08);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start(now);
                        osc.stop(now + 0.12);
                        break;
                    }
                    case 'explosion': {
                        const bufferSize = this.ctx.sampleRate * 0.4;
                        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                        const data = buffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
                        }
                        const source = this.ctx.createBufferSource();
                        source.buffer = buffer;
                        const gain = this.ctx.createGain();
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(800, now);
                        filter.frequency.exponentialRampToValueAtTime(100, now + 0.35);
                        source.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.masterGain);
                        source.start(now);
                        break;
                    }
                    case 'hit': {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.06);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    }
                    case 'powerup': {
                        [400, 600, 800, 1000].forEach((freq, i) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0.08, now + i * 0.06);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                            osc.connect(gain);
                            gain.connect(this.masterGain);
                            osc.start(now + i * 0.06);
                            osc.stop(now + i * 0.06 + 0.18);
                        });
                        break;
                    }
                    case 'levelup': {
                        [523, 659, 784, 1047].forEach((freq, i) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0.12, now + i * 0.12);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
                            osc.connect(gain);
                            gain.connect(this.masterGain);
                            osc.start(now + i * 0.12);
                            osc.stop(now + i * 0.12 + 0.35);
                        });
                        break;
                    }
                    case 'alarm': {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(280, now + 0.15);
                        osc.frequency.setValueAtTime(440, now + 0.3);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.setValueAtTime(0.01, now + 0.14);
                        gain.gain.setValueAtTime(0.1, now + 0.16);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start(now);
                        osc.stop(now + 0.5);
                        break;
                    }
                    case 'bossHit': {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);
                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        const dist = this.ctx.createWaveShaper();
                        dist.curve = new Float32Array([0, 0.4, 0.6, 0.7, 0.7, 0.5, 0.2, -0.2, -0.5, -0.3, 0]);
                        osc.connect(dist);
                        dist.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start(now);
                        osc.stop(now + 0.35);
                        break;
                    }
                }
            }
        }

        // ==================== ОСНОВНОЙ КЛАСС ИГРЫ ====================
        class SpaceShooterGame {

                this.scene = null;
                this.camera = null;

                this.aliensInLevel = 0;

                this.gamePaused = false;

                this.levelTransitionTimer = 0;

                this.screenShakeOffset = new THREE.Vector3();

                this.keys = {};

                this.mouseY = 0;
                this.mouseDown = false;
                this.useMouseControl = false;

                this.particlePool = [];

                this.domScore = null;
                this.domHealthFill = null;
                this.domHealthText = null;

            // ==================== ИНИЦИАЛИЗАЦИЯ ====================
            init() {
                this.setupRenderer();
                this.setupScene();
                this.setupCamera();
                this.setupLighting();
                this.createStarfield();
                this.createNebulaEffect();
                this.createPlayerShip();
                this.initParticlePool();
                this.setupInput();
                this.cacheDomElements();
                this.updateHUD();
                this.audio.init();

                // Привязка методов
                this.gameLoop = this.gameLoop.bind(this);
                this.onResize = this.onResize.bind(this);
                window.addEventListener('resize', this.onResize);

                // Запуск игрового цикла
                this.startLevel(1);
                requestAnimationFrame(this.gameLoop);
            }

            createStarfield() {
                // Создаем звёзды с помощью BufferGeometry
                const starGeo = new THREE.BufferGeometry();
                const starCount = GAME_CONFIG.STAR_COUNT;
                const positions = new Float32Array(starCount * 3);
                const colors = new Float32Array(starCount * 3);
                const sizes = new Float32Array(starCount);

                for (let i = 0; i < starCount; i++) {
                    // Распределяем звёзды в большом объёме
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = 30 + Math.random() * 80;
                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = radius * Math.cos(phi) + 15;

                    // Цвет звёзд: от белого до голубоватого
                    const colorChoice = Math.random();
                    if (colorChoice < 0.6) {
                        colors[i * 3] = 0.8 + Math.random() * 0.2;
                        colors[i * 3 + 1] = 0.85 + Math.random() * 0.15;
                        colors[i * 3 + 2] = 0.9 + Math.random() * 0.1;
                    } else if (colorChoice < 0.8) {
                        colors[i * 3] = 0.5 + Math.random() * 0.3;
                        colors[i * 3 + 1] = 0.6 + Math.random() * 0.3;
                        colors[i * 3 + 2] = 0.9 + Math.random() * 0.1;
                    } else if (colorChoice < 0.92) {
                        colors[i * 3] = 0.9 + Math.random() * 0.1;
                        colors[i * 3 + 1] = 0.7 + Math.random() * 0.2;
                        colors[i * 3 + 2] = 0.4 + Math.random() * 0.3;
                    } else {
                        colors[i * 3] = 0.7 + Math.random() * 0.3;
                        colors[i * 3 + 1] = 0.3 + Math.random() * 0.3;
                        colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;
                    }
                    sizes[i] = 0.3 + Math.random() * 2.5;
                }

                starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

                // Используем PointsMaterial с текстурой-кружком
                const starMat = new THREE.PointsMaterial({
                    size: 0.25,
                    vertexColors: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                    opacity: 0.9,
                    sizeAttenuation: true,
                });

                const stars = new THREE.Points(starGeo, starMat);
                stars.name = 'starfield';
                this.scene.add(stars);
                this.starfield = stars;

                // Дополнительный слой пыли (мелкие частицы ближе)
                const dustGeo = new THREE.BufferGeometry();
                const dustCount = 1500;
                const dustPositions = new Float32Array(dustCount * 3);
                for (let i = 0; i < dustCount; i++) {
                    dustPositions[i * 3] = (Math.random() - 0.5) * 50;
                    dustPositions[i * 3 + 1] = (Math.random() - 0.5) * 35;
                    dustPositions[i * 3 + 2] = Math.random() * 70 - 10;
                }
                dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
                const dustMat = new THREE.PointsMaterial({
                    size: 0.08,
                    color: 0x8899cc,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                    opacity: 0.55,
                    sizeAttenuation: true,
                });
                const dust = new THREE.Points(dustGeo, dustMat);
                dust.name = 'spaceDust';
                this.scene.add(dust);
                this.spaceDustMesh = dust;
            }

            initParticlePool() {
                const poolSize = GAME_CONFIG.PARTICLE_POOL_SIZE;
                for (let i = 0; i < poolSize; i++) {
                    const geo = new THREE.SphereGeometry(0.06, 4, 4);
                    const mat = new THREE.MeshBasicMaterial({
                        color: 0xffaa00,
                        transparent: true,
                        opacity: 0,
                        depthWrite: false,
                    });
                    const particle = new THREE.Mesh(geo, mat);
                    particle.visible = false;
                    particle.userData = {
                        velocity: new THREE.Vector3(),
                        life: 0,
                        maxLife: 0,
                        active: false,
                    };
                    this.scene.add(particle);
                    this.particlePool.push(particle);
                }
                this.particlePoolIndex = 0;
            }

            spawnParticle(position, color, velocity, life, size = 0.06) {
                const particle = this.particlePool[this.particlePoolIndex];
                if (!particle) return;
                this.particlePoolIndex = (this.particlePoolIndex + 1) % this.particlePool.length;

                particle.position.copy(position);
                particle.userData.velocity.copy(velocity);
                particle.userData.life = life;
                particle.userData.maxLife = life;
                particle.userData.active = true;
                particle.visible = true;
                particle.material.color.setHex(color);
                particle.material.opacity = 1;
                particle.scale.setScalar(size / 0.06);
            }

            // ==================== ВВОД ====================
            setupInput() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    this.audio.resume();

                    // Переключение оружия
                    if (e.code === 'Digit1') this.switchWeapon(1);
                    if (e.code === 'Digit2') this.switchWeapon(2);
                    if (e.code === 'Digit3') this.switchWeapon(3);
                    if (e.code === 'Digit4') this.switchWeapon(4);
                    if (e.code === 'KeyQ') this.cycleWeapon(-1);
                    if (e.code === 'KeyE') this.cycleWeapon(1);

                    // Пауза
                    if (e.code === 'KeyP' && !this.gameOver) {
                        this.gamePaused = !this.gamePaused;
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                window.addEventListener('mousemove', (e) => {
                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;
                    this.useMouseControl = true;
                });

                window.addEventListener('mousedown', (e) => {
                    if (e.button === 0) {
                        this.mouseDown = true;
                        this.audio.resume();
                    }
                });

                window.addEventListener('mouseup', (e) => {
                    if (e.button === 0) this.mouseDown = false;
                });

                window.addEventListener('contextmenu', (e) => e.preventDefault());

                // Обработчик для мобильных устройств
                window.addEventListener('touchstart', (e) => {
                    this.mouseDown = true;
                    this.audio.resume();
                    if (e.touches.length > 0) {
                        this.mouseX = e.touches[0].clientX;
                        this.mouseY = e.touches[0].clientY;
                        this.useMouseControl = true;
                    }
                });
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        this.mouseX = e.touches[0].clientX;
                        this.mouseY = e.touches[0].clientY;
                    }
                });
                window.addEventListener('touchend', () => {
                    this.mouseDown = false;
                });
            }

            switchWeapon(id) {
                const weapon = Object.values(WEAPONS).find(w => w.id === id);
                if (weapon && weapon.unlockLevel <= this.level) {
                    this.currentWeapon = weapon;
                    this.fireCooldown = 0;
                    this.updateWeaponDisplay();
                }
            }

            cycleWeapon(dir) {
                const unlocked = Object.values(WEAPONS).filter(w => w.unlockLevel <= this.level);
                if (unlocked.length === 0) return;
                const currentIdx = unlocked.indexOf(this.currentWeapon);
                const newIdx = (currentIdx + dir + unlocked.length) % unlocked.length;
                this.currentWeapon = unlocked[newIdx];
                this.fireCooldown = 0;
                this.updateWeaponDisplay();
            }

            updateWeaponDisplay() {
                if (this.domWeaponName) {
                    this.domWeaponName.textContent = this.currentWeapon.name;
                }
            }

            // ==================== DOM КЭШИРОВАНИЕ ====================
            cacheDomElements() {
                this.domScore = document.getElementById('scoreValue');
                this.domHealthFill = document.getElementById('healthFill');
                this.domHealthText = document.getElementById('healthText');
                this.domLevelNum = document.getElementById('levelNumber');
                this.domLevelProgress = document.getElementById('levelProgress');
                this.domWeaponName = document.getElementById('weaponName');
                this.domEnemyCount = document.getElementById('enemyCountVal');
                this.domMessageOverlay = document.getElementById('messageOverlay');
                this.domComboDisplay = document.getElementById('comboDisplay');
                this.domLowHealthWarning = document.getElementById('lowHealthWarning');
                this.domGameOverScreen = document.getElementById('gameOverScreen');
                this.domFinalScore = document.getElementById('finalScore');
                this.domFinalLevel = document.getElementById('finalLevel');
                this.domRestartBtn = document.getElementById('restartBtn');

                if (this.domRestartBtn) {
                    this.domRestartBtn.addEventListener('click', () => this.restartGame());
                }
                this.updateWeaponDisplay();
            }

            updateHUD() {
                if (this.domScore) this.domScore.textContent = Math.floor(this.score).toLocaleString();
                const healthPercent = Math.max(0, this.playerHealth / this.playerMaxHealth * 100);
                if (this.domHealthFill) this.domHealthFill.style.width = healthPercent + '%';
                if (this.domHealthText) this.domHealthText.textContent = Math.ceil(this.playerHealth) + '%';
                if (this.domLevelNum) this.domLevelNum.textContent = this.level;
                if (this.domLevelProgress) {
                    this.domLevelProgress.textContent =
                        this.aliensDestroyedThisLevel + '/' + this.aliensInLevel;
                }
                if (this.domEnemyCount) {
                    this.domEnemyCount.textContent = this.aliens.length;
                }

                // Предупреждение о низком здоровье
                if (this.domLowHealthWarning) {
                    if (this.playerHealth < 30 && this.playerHealth > 0) {
                        this.domLowHealthWarning.style.display = 'block';
                    } else {
                        this.domLowHealthWarning.style.display = 'none';
                    }
                }

                // Если здоровье критическое — меняем цвет заливки
                if (this.domHealthFill) {
                    if (healthPercent < 25) {
                        this.domHealthFill.style.background = 'linear-gradient(90deg, #990000, #cc0000, #ff2222)';
                    } else if (healthPercent < 50) {
                        this.domHealthFill.style.background = 'linear-gradient(90deg, #cc4400, #ff6600, #ff8844)';
                    } else {
                        this.domHealthFill.style.background = 'linear-gradient(90deg, #00aa44, #00dd55, #44ff88)';
                    }
                }
            }

            showMessage(text, duration = 1.8) {
                if (!this.domMessageOverlay) return;
                this.domMessageOverlay.textContent = text;
                this.domMessageOverlay.classList.add('visible');
                clearTimeout(this._msgTimeout);
                this._msgTimeout = setTimeout(() => {
                    if (this.domMessageOverlay) this.domMessageOverlay.classList.remove('visible');
                }, duration * 1000);
            }

            showCombo(count) {
                if (!this.domComboDisplay || count < 3) {
                    if (this.domComboDisplay) this.domComboDisplay.style.opacity = '0';
                    return;
                }
                this.domComboDisplay.textContent = '🔥 КОМБО x' + count + '!';
                this.domComboDisplay.style.opacity = '1';
                clearTimeout(this._comboTimeout);
                this._comboTimeout = setTimeout(() => {
                    if (this.domComboDisplay) this.domComboDisplay.style.opacity = '0';
                }, 1500);
            }

            // ==================== УРОВНИ И ВРАГИ ====================
            startLevel(levelNum) {
                this.level = levelNum;
                this.aliensInLevel = GAME_CONFIG.BASE_ALIENS_PER_LEVEL + (levelNum - 1) * GAME_CONFIG
                    .ALIENS_INCREMENT;
                this.aliensDestroyedThisLevel = 0;
                this.aliensToSpawnThisLevel = this.aliensInLevel;
                this.aliensSpawned = 0;
                this.alienSpawnTimer = 0;
                this.alienSpawnInterval = Math.max(0.4, 1.5 - levelNum * 0.08);
                this.levelTransition = true;
                this.levelTransitionTimer = 1.5;

                // Очистка существующих врагов и снарядов
                this.clearAllEnemies();
                this.bullets.forEach(b => this.scene.remove(b));
                this.bullets = [];
                this.enemyBullets.forEach(b => this.scene.remove(b));
                this.enemyBullets = [];
                this.powerUps.forEach(p => this.scene.remove(p));
                this.powerUps = [];

                this.showMessage('🌌 УРОВЕНЬ ' + levelNum, 2.0);
                this.audio.playSound('levelup');
                this.updateHUD();
                this.updateWeaponDisplay();
            }

            clearAllEnemies() {
                for (const alien of this.aliens) {
                    this.scene.remove(alien);
                }
                this.aliens = [];
            }

            spawnAlien(typeKey = null) {
                if (this.aliensSpawned >= this.aliensToSpawnThisLevel) return null;
                if (this.levelTransition && this.levelTransitionTimer > 0) return null;

                // Определяем тип пришельца
                let type;
                if (typeKey && ALIEN_TYPES[typeKey]) {
                    type = ALIEN_TYPES[typeKey];
                } else {
                    const roll = Math.random();
                    if (this.level >= 5 && this.aliensSpawned === this.aliensToSpawnThisLevel - 1 && Math.random() <
                        0.5) {
                        type = ALIEN_TYPES.BOSS;
                    } else if (this.level >= 4 && roll < 0.2) {
                        type = ALIEN_TYPES.HEAVY;
                    } else if (this.level >= 2 && roll < 0.45) {
                        type = ALIEN_TYPES.FIGHTER;
                    } else {
                        type = ALIEN_TYPES.SCOUT;
                    }
                }

                // Создаём геометрию
                let geo;
                switch (type.geometryType) {
                    case 'icosahedron':
                        geo = new THREE.IcosahedronGeometry(type.size, 1);
                        break;
                    case 'dodecahedron':
                        geo = new THREE.DodecahedronGeometry(type.size, 1);
                        break;
                    case 'octahedron':
                        geo = new THREE.OctahedronGeometry(type.size, 1);
                        break;
                    case 'torusKnot':
                        geo = new THREE.TorusKnotGeometry(type.size * 0.6, type.size * 0.2, 40, 12, 2, 3);
                        break;
                    default:
                        geo = new THREE.IcosahedronGeometry(type.size, 1);
                }

                const mat = new THREE.MeshPhongMaterial({
                    color: type.color,
                    emissive: type.emissive,
                    specular: 0x333333,
                    shininess: 25,
                    flatShading: true,
                });

                const alien = new THREE.Mesh(geo, mat);
                alien.userData = {
                    type: type,
                    health: type.health + (this.level - 1) * 8,
                    maxHealth: type.health + (this.level - 1) * 8,
                    speed: type.speed * (GAME_CONFIG.ALIEN_SPEED_BASE + this.level * 1.2),
                    score: type.score,
                    shootChance: type.shootChance * (1 + this.level * 0.3),
                    movePattern: type.movePattern,
                    zigzagAmp: type.zigzagAmp || 0,
                    zigzagFreq: type.zigzagFreq || 0,
                    sineAmp: type.sineAmp || 0,
                    sineFreq: type.sineFreq || 0,
                    initialX: 0,
                    spawnTime: this.gameTime,
                    phaseOffset: Math.random() * Math.PI * 2,
                };

                // Позиция появления
                const spawnX = (Math.random() - 0.5) * 22;
                const spawnY = (Math.random() - 0.5) * 14;
                alien.position.set(spawnX, spawnY, GAME_CONFIG.ALIEN_SPAWN_DISTANCE);
                alien.userData.initialX = spawnX;

                // Добавляем оружие боссам и тяжёлым
                if (type === ALIEN_TYPES.BOSS || type === ALIEN_TYPES.HEAVY) {
                    const turretGeo = new THREE.SphereGeometry(type.size * 0.22, 6, 6);
                    const turretMat = new THREE.MeshBasicMaterial({ color: 0xff0000, depthWrite: false });
                    for (let t = 0; t < (type === ALIEN_TYPES.BOSS ? 4 : 2); t++) {
                        const turret = new THREE.Mesh(turretGeo, turretMat);
                        const angle = (t / (type === ALIEN_TYPES.BOSS ? 4 : 2)) * Math.PI * 2;
                        turret.position.set(
                            Math.cos(angle) * type.size * 0.8,
                            Math.sin(angle) * type.size * 0.8,
                            0
                        );
                        turret.name = 'turret';
                        alien.add(turret);
                    }
                }

                this.scene.add(alien);
                this.aliens.push(alien);
                this.aliensSpawned++;
                return alien;
            }

            spawnEnemyBullet(fromPosition, targetDirection) {
                const geo = new THREE.SphereGeometry(0.12, 6, 6);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xff3333,
                    transparent: true,
                    opacity: 0.9,
                    depthWrite: false,
                });
                const bullet = new THREE.Mesh(geo, mat);
                bullet.position.copy(fromPosition);
                bullet.userData = {
                    velocity: targetDirection.clone().normalize().multiplyScalar(GAME_CONFIG.ENEMY_BULLET_SPEED),
                    life: 3.5,
                };
                // Добавляем свечение
                const glowGeo = new THREE.SphereGeometry(0.2, 4, 4);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xff6600,
                    transparent: true,
                    opacity: 0.5,
                    depthWrite: false,
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                bullet.add(glow);

                this.scene.add(bullet);
                this.enemyBullets.push(bullet);
            }

            spawnPowerUp(position) {
                const types = ['health', 'rapidFire', 'shield', 'scoreBonus'];
                const type = types[Math.floor(Math.random() * types.length)];
                const geo = new THREE.OctahedronGeometry(0.35, 0);
                let color;
                switch (type) {
                    case 'health':
                        color = 0x44ff44;
                        break;
                    case 'rapidFire':
                        color = 0x4488ff;
                        break;
                    case 'shield':
                        color = 0xffcc00;
                        break;
                    case 'scoreBonus':
                        color = 0xff44ff;
                        break;
                    default:
                        color = 0xffffff;
                }
                const mat = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.8,
                    specular: 0xffffff,
                    shininess: 80,
                });
                const powerUp = new THREE.Mesh(geo, mat);
                powerUp.position.copy(position);
                powerUp.userData = {
                    type: type,
                    life: 8,
                    rotationSpeed: 2 + Math.random() * 3,
                };
                // Внешнее кольцо
                const ringGeo = new THREE.TorusGeometry(0.5, 0.06, 8, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.6,
                    depthWrite: false });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                powerUp.add(ring);

                this.scene.add(powerUp);
                this.powerUps.push(powerUp);
            }

            // ==================== СТРЕЛЬБА ====================
            fireWeapon() {
                if (this.fireCooldown > 0 || this.gameOver || this.gamePaused) return;
                if (this.levelTransition && this.levelTransitionTimer > 0) return;

                const wp = this.currentWeapon;
                const playerPos = this.player.position.clone();
                const forward = new THREE.Vector3(0, 0, 1);

                for (let i = 0; i < wp.bulletCount; i++) {
                    const geo = new THREE.CylinderGeometry(wp.bulletSize, wp.bulletSize * 0.7, 0.6, 6, 3);
                    const mat = new THREE.MeshBasicMaterial({
                        color: wp.bulletColor,
                        transparent: true,
                        opacity: 0.95,
                        depthWrite: false,
                    });
                    const bullet = new THREE.Mesh(geo, mat);
                    bullet.rotation.x = Math.PI / 2;

                    // Позиция выстрела
                    const spawnPos = playerPos.clone();
                    spawnPos.z += 1.5;
                    if (wp.bulletCount > 1 && i > 0) {
                        const offset = (i - (wp.bulletCount - 1) / 2) * 0.5;
                        spawnPos.x += offset;
                    }
                    bullet.position.copy(spawnPos);

                    // Направление с разбросом
                    const dir = forward.clone();
                    if (wp.spread > 0 && wp.bulletCount > 1) {
                        const spreadAngle = ((i / (wp.bulletCount - 1)) - 0.5) * wp.spread;
                        dir.x += spreadAngle;
                    }
                    // Добавляем небольшой случайный разброс
                    dir.x += (Math.random() - 0.5) * 0.04;
                    dir.y += (Math.random() - 0.5) * 0.04;
                    dir.normalize();

                    bullet.userData = {
                        velocity: dir.multiplyScalar(GAME_CONFIG.BULLET_SPEED),
                        damage: wp.damage,
                        life: 1.8,
                    };

                    // Свечение снаряда
                    const glowGeo = new THREE.SphereGeometry(wp.bulletSize * 1.8, 4, 4);
                    const glowMat = new THREE.MeshBasicMaterial({
                        color: wp.bulletColor,
                        transparent: true,
                        opacity: 0.4,
                        depthWrite: false,
                    });
                    const glow = new THREE.Mesh(glowGeo, glowMat);
                    bullet.add(glow);

                    this.scene.add(bullet);
                    this.bullets.push(bullet);
                }

                this.fireCooldown = this.playerRapidFire ? wp.fireRate * 0.35 : wp.fireRate;
                this.audio.playSound('shoot', { freq: wp.soundFreq });

                // Лёгкая отдача — небольшой толчок камеры
                this.screenShake = Math.max(this.screenShake, 0.15);
            }

            // ==================== КОЛЛИЗИИ ====================
            checkCollisions() {
                // Пули игрока против пришельцев
                for (let b = this.bullets.length - 1; b >= 0; b--) {
                    const bullet = this.bullets[b];
                    if (!bullet || !bullet.userData) continue;
                    let bulletHit = false;

                    for (let a = this.aliens.length - 1; a >= 0; a--) {
                        const alien = this.aliens[a];
                        if (!alien || !alien.userData) continue;
                        const dist = bullet.position.distanceTo(alien.position);
                        const hitRadius = alien.userData.type.size + 0.5;

                        if (dist < hitRadius) {
                            // Попадание!
                            alien.userData.health -= bullet.userData.damage;
                            this.spawnHitEffect(bullet.position.clone(), alien.userData.type.color);
                            bulletHit = true;

                            if (alien.userData.health <= 0) {
                                this.destroyAlien(alien, a);
                            } else {
                                this.audio.playSound('hit');
                                // Небольшой отброс пришельца
                                const pushDir = alien.position.clone().sub(bullet.position).normalize();
                                alien.position.add(pushDir.multiplyScalar(0.8));
                                // Визуальная вспышка
                                alien.material.emissive.setHex(0xffffff);
                                setTimeout(() => {
                                    if (alien && alien.material) alien.material.emissive.setHex(alien.userData
                                        .type.emissive);
                                }, 60);
                            }
                            break;
                        }
                    }

                    if (bulletHit) {
                        this.scene.remove(bullet);
                        this.bullets.splice(b, 1);
                    }
                }

                // Вражеские пули против игрока
                if (this.playerInvincible <= 0) {
                    for (let eb = this.enemyBullets.length - 1; eb >= 0; eb--) {
                        const eBullet = this.enemyBullets[eb];
                        if (!eBullet) continue;
                        const dist = eBullet.position.distanceTo(this.player.position);
                        if (dist < 1.2) {
                            this.playerTakeDamage(12);
                            this.spawnHitEffect(eBullet.position.clone(), 0xff3333);
                            this.scene.remove(eBullet);
                            this.enemyBullets.splice(eb, 1);
                            this.screenShake = Math.max(this.screenShake, 0.4);
                        }
                    }
                }

                // Пришельцы против игрока (столкновение)
                if (this.playerInvincible <= 0) {
                    for (let a = this.aliens.length - 1; a >= 0; a--) {
                        const alien = this.aliens[a];
                        if (!alien) continue;
                        const dist = alien.position.distanceTo(this.player.position);
                        if (dist < 1.8) {
                            this.playerTakeDamage(25);
                            this.destroyAlien(alien, a);
                            this.screenShake = Math.max(this.screenShake, 0.7);
                            this.audio.playSound('explosion');
                        }
                    }
                }

                // Сбор бонусов
                for (let p = this.powerUps.length - 1; p >= 0; p--) {
                    const powerUp = this.powerUps[p];
                    if (!powerUp) continue;
                    const dist = powerUp.position.distanceTo(this.player.position);
                    if (dist < 2.0) {
                        this.collectPowerUp(powerUp, p);
                    }
                }
            }

            destroyAlien(alien, index) {
                // Эффект взрыва
                const pos = alien.position.clone();
                const color = alien.userData.type.color;
                this.spawnExplosion(pos, color, alien.userData.type === ALIEN_TYPES.BOSS ? 50 : 20);

                // Очки
                const baseScore = alien.userData.score;
                const comboBonus = Math.min(this.comboCount, 20) * 15;
                const totalScore = baseScore + comboBonus;
                this.score += totalScore;
                this.aliensDestroyedThisLevel++;

                // Комбо
                this.comboCount++;
                this.comboTimer = GAME_CONFIG.COMBO_TIMEOUT;
                if (this.comboCount > this.maxCombo) this.maxCombo = this.comboCount;
                this.showCombo(this.comboCount);

                // Шанс на бонус
                if (Math.random() < GAME_CONFIG.POWERUP_DROP_CHANCE) {
                    this.spawnPowerUp(pos);
                }

                // Звук
                if (alien.userData.type === ALIEN_TYPES.BOSS) {
                    this.audio.playSound('bossHit');
                    this.screenShake = Math.max(this.screenShake, 1.5);
                } else {
                    this.audio.playSound('explosion');
                }

                // Удаление пришельца
                this.scene.remove(alien);
                this.aliens.splice(index, 1);

                // Проверка завершения уровня
                if (this.aliensDestroyedThisLevel >= this.aliensInLevel && this.aliens.length === 0) {
                    this.completeLevel();
                }

                this.updateHUD();
            }

            spawnExplosion(position, color, particleCount = 25) {
                for (let i = 0; i < particleCount; i++) {
                    const vel = new THREE.Vector3(
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10,
                        (Math.random() - 0.5) * 10
                    );
                    const life = 0.4 + Math.random() * 1.2;
                    const size = 0.04 + Math.random() * 0.2;
                    const particleColor = color;
                    this.spawnParticle(position.clone(), particleColor, vel, life, size);
                }
                // Дополнительные оранжевые/жёлтые частицы
                for (let i = 0; i < Math.floor(particleCount * 0.5); i++) {
                    const vel = new THREE.Vector3(
                        (Math.random() - 0.5) * 7,
                        (Math.random() - 0.5) * 7,
                        (Math.random() - 0.5) * 7
                    );
                    const life = 0.3 + Math.random() * 0.7;
                    const orangeColors = [0xff6600, 0xff8800, 0xffaa00, 0xffcc00];
                    const col = orangeColors[Math.floor(Math.random() * orangeColors.length)];
                    this.spawnParticle(position.clone(), col, vel, life, 0.06 + Math.random() * 0.15);
                }
            }

            spawnHitEffect(position, color) {
                for (let i = 0; i < 8; i++) {
                    const vel = new THREE.Vector3(
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3
                    );
                    this.spawnParticle(position.clone(), color, vel, 0.2 + Math.random() * 0.3, 0.03 + Math.random() *
                        0.06);
                }
            }

            playerTakeDamage(amount) {
                if (this.playerInvincible > 0 || this.playerShieldActive) return;
                this.playerHealth -= amount;
                this.playerInvincible = 0.6;
                this.screenShake = Math.max(this.screenShake, 0.5);
                this.audio.playSound('alarm');

                if (this.playerHealth <= 0) {
                    this.playerHealth = 0;
                    this.endGame();
                }
                this.updateHUD();
            }

            collectPowerUp(powerUp, index) {
                const type = powerUp.userData.type;
                switch (type) {
                    case 'health':
                        this.playerHealth = Math.min(this.playerMaxHealth, this.playerHealth + 35);
                        this.showMessage('💚 +ЗДОРОВЬЕ', 1.2);
                        break;
                    case 'rapidFire':
                        this.playerRapidFire = true;
                        this.playerRapidFireTimer = 6;
                        this.showMessage('⚡ СКОРОСТРЕЛЬНОСТЬ', 1.2);
                        break;
                    case 'shield':
                        this.playerShieldActive = true;
                        this.playerInvincible = 5;
                        this.showMessage('🛡️ ЩИТ АКТИВЕН', 1.5);
                        // Визуальный эффект щита
                        this.createShieldEffect();
                        break;
                    case 'scoreBonus':
                        const bonus = 300 + this.level * 50;
                        this.score += bonus;
                        this.showMessage('✨ +' + bonus + ' ОЧКОВ', 1.2);
                        break;
                }
                this.audio.playSound('powerup');
                this.scene.remove(powerUp);
                this.powerUps.splice(index, 1);
                this.updateHUD();
            }

            createShieldEffect() {
                // Удаляем старый щит если есть
                if (this.shieldMesh) {
                    this.player.remove(this.shieldMesh);
                }
                const shieldGeo = new THREE.SphereGeometry(1.5, 24, 24);
                const shieldMat = new THREE.MeshBasicMaterial({
                    color: 0x44aaff,
                    transparent: true,
                    opacity: 0.3,
                    depthWrite: false,
                    wireframe: true,
                });
                this.shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
                this.shieldMesh.name = 'shield';
                this.player.add(this.shieldMesh);
            }

            removeShieldEffect() {
                if (this.shieldMesh) {
                    this.player.remove(this.shieldMesh);
                    this.shieldMesh = null;
                }
            }

            completeLevel() {
                this.levelTransition = true;
                this.levelTransitionTimer = 2.0;
                const bonusScore = this.level * 500;
                this.score += bonusScore;
                this.showMessage('🎉 УРОВЕНЬ ' + this.level + ' ПРОЙДЕН!\nБОНУС: +' + bonusScore, 2.5);
                this.audio.playSound('levelup');
                this.updateHUD();

                // Запускаем следующий уровень после паузы
                setTimeout(() => {
                    if (!this.gameOver) {
                        this.startLevel(this.level + 1);
                    }
                }, 2200);
            }

            endGame() {
                this.gameOver = true;
                this.audio.playSound('explosion');
                this.audio.stopBackgroundHum();
                this.spawnExplosion(this.player.position.clone(), 0xffffff, 40);

                // Скрываем игрока
                this.player.visible = false;

                // Показываем экран Game Over
                if (this.domGameOverScreen) {
                    this.domGameOverScreen.classList.add('active');
                }
                if (this.domFinalScore) {
                    this.domFinalScore.textContent = Math.floor(this.score).toLocaleString();
                }
                if (this.domFinalLevel) {
                    this.domFinalLevel.textContent = this.level;
                }
                document.getElementById('crosshair').style.display = 'none';
                document.body.style.cursor = 'default';
            }

            restartGame() {
                // Полный сброс
                this.score = 0;
                this.playerHealth = GAME_CONFIG.PLAYER_MAX_HEALTH;
                this.playerInvincible = 0;
                this.playerShieldActive = false;
                this.playerRapidFire = false;
                this.playerRapidFireTimer = 0;
                this.comboCount = 0;
                this.comboTimer = 0;
                this.maxCombo = 0;
                this.gameOver = false;
                this.gamePaused = false;
                this.levelTransition = false;
                this.levelTransitionTimer = 0;
                this.screenShake = 0;
                this.fireCooldown = 0;
                this.currentWeapon = WEAPONS.PULSE_LASER;
                this.player.position.set(0, 0, -1);
                this.player.visible = true;
                this.removeShieldEffect();

                // Очистка
                this.clearAllEnemies();
                this.bullets.forEach(b => this.scene.remove(b));
                this.bullets = [];
                this.enemyBullets.forEach(b => this.scene.remove(b));
                this.enemyBullets = [];
                this.powerUps.forEach(p => this.scene.remove(p));
                this.powerUps = [];
                // Сброс частиц
                this.particlePool.forEach(p => {
                    p.visible = false;
                    p.userData.active = false;
                    p.userData.life = 0;
                });

                if (this.domGameOverScreen) {
                    this.domGameOverScreen.classList.remove('active');
                }
                document.getElementById('crosshair').style.display = 'block';
                document.body.style.cursor = 'none';

                this.audio.init();
                this.audio.startBackgroundHum();
                this.updateHUD();
                this.updateWeaponDisplay();
                this.startLevel(1);
            }

            // ==================== ОСНОВНОЙ ИГРОВОЙ ЦИКЛ ====================
            gameLoop(timestamp) {
                requestAnimationFrame(this.gameLoop);

                if (this.gameOver) {
                    // Даже после game over немного обновляем частицы
                    this.updateParticles(0.016);
                    this.renderer.render(this.scene, this.camera);
                    return;
                }

                this.deltaTime = Math.min(this.clock.getDelta(), 0.1);
                if (this.gamePaused) {
                    this.renderer.render(this.scene, this.camera);
                    return;
                }
                this.gameTime += this.deltaTime;

                // Переход между уровнями
                if (this.levelTransition) {
                    this.levelTransitionTimer -= this.deltaTime;
                    if (this.levelTransitionTimer <= 0) {
                        this.levelTransition = false;
                        this.levelTransitionTimer = 0;
                    }
                }

                this.updateInput();
                this.updatePlayer(this.deltaTime);
                this.updateAliens(this.deltaTime);
                this.updateBullets(this.deltaTime);
                this.updateEnemyBullets(this.deltaTime);
                this.updatePowerUps(this.deltaTime);
                this.updateParticles(this.deltaTime);
                this.updateSpawning(this.deltaTime);
                this.updateTimers(this.deltaTime);
                this.checkCollisions();
                this.updateScreenShake(this.deltaTime);
                this.updateStarfield(this.deltaTime);
                this.updateHUD();

                // Рендер
                this.renderer.render(this.scene, this.camera);
            }

            updateInput() {
                // Движение игрока
                let moveX = 0;
                let moveY = 0;

                if (this.useMouseControl) {
                    // Управление мышью: корабль следует за курсором
                    const targetX = (this.mouseX / window.innerWidth - 0.5) * GAME_CONFIG.PLAYER_BOUNDS_X * 2;
                    const targetY = -(this.mouseY / window.innerHeight - 0.5) * GAME_CONFIG.PLAYER_BOUNDS_Y * 2;
                    const currentPos = this.player.position;
                    const lerpFactor = 6 * this.deltaTime;
                    moveX = (targetX - currentPos.x) * lerpFactor * 3;
                    moveY = (targetY - currentPos.y) * lerpFactor * 3;
                }

                // Клавиатура (дополняет или заменяет мышь)
                if (this.keys['KeyW'] || this.keys['ArrowUp']) moveY = GAME_CONFIG.PLAYER_SPEED * this.deltaTime;
                if (this.keys['KeyS'] || this.keys['ArrowDown']) moveY = -GAME_CONFIG.PLAYER_SPEED * this.deltaTime;
                if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveX = -GAME_CONFIG.PLAYER_SPEED * this.deltaTime;
                if (this.keys['KeyD'] || this.keys['ArrowRight']) moveX = GAME_CONFIG.PLAYER_SPEED * this.deltaTime;

                // Если нажимаем клавиши — отключаем следование за мышью на время
                if (this.keys['KeyW'] || this.keys['KeyS'] || this.keys['KeyA'] || this.keys['KeyD'] ||
                    this.keys['ArrowUp'] || this.keys['ArrowDown'] || this.keys['ArrowLeft'] || this.keys['ArrowRight']) {
                    this.useMouseControl = false;
                }

                // Применяем движение
                this.player.position.x += moveX;
                this.player.position.y += moveY;

                // Ограничения
                this.player.position.x = THREE.MathUtils.clamp(
                    this.player.position.x,
                    -GAME_CONFIG.PLAYER_BOUNDS_X,
                    GAME_CONFIG.PLAYER_BOUNDS_X
                );
                this.player.position.y = THREE.MathUtils.clamp(
                    this.player.position.y,
                    -GAME_CONFIG.PLAYER_BOUNDS_Y,
                    GAME_CONFIG.PLAYER_BOUNDS_Y
                );

                // Стрельба
                const shootInput = this.keys['Space'] || this.mouseDown;
                if (shootInput) {
                    this.fireWeapon();
                }
            }

            updatePlayer(dt) {
                // Анимация двигателей
                const glowPulse = 0.7 + Math.sin(this.gameTime * 18) * 0.3;
                if (this.leftEngineGlow) {
                    this.leftEngineGlow.material.opacity = glowPulse;
                    this.leftEngineGlow.scale.setScalar(0.8 + Math.random() * 0.4);
                }
                if (this.rightEngineGlow) {
                    this.rightEngineGlow.material.opacity = glowPulse;
                    this.rightEngineGlow.scale.setScalar(0.8 + Math.random() * 0.4);
                }

                // Лёгкое покачивание корабля
                this.player.rotation.z = Math.sin(this.gameTime * 3.5) * 0.04;
                this.player.rotation.x = Math.sin(this.gameTime * 2.8 + 0.5) * 0.03;

                // Неуязвимость — мигание
                if (this.playerInvincible > 0) {
                    this.player.visible = Math.floor(this.gameTime * 20) % 2 === 0;
                } else if (!this.gameOver) {
                    this.player.visible = true;
                }

                // Обновление щита
                if (this.shieldMesh) {
                    this.shieldMesh.rotation.y += dt * 2;
                    this.shieldMesh.rotation.x += dt * 1.5;
                }
            }

            updateAliens(dt) {
                const playerPos = this.player.position;
                for (let a = this.aliens.length - 1; a >= 0; a--) {
                    const alien = this.aliens[a];
                    if (!alien || !alien.userData) continue;
                    const ud = alien.userData;
                    const type = ud.type;

                    // Движение в зависимости от паттерна
                    let moveX = 0;
                    let moveY = 0;
                    const baseSpeed = ud.speed * dt;
                    const timeSinceSpawn = this.gameTime - ud.spawnTime;

                    switch (ud.movePattern) {
                        case 'zigzag':
                            moveZ = -baseSpeed;
                            moveX = Math.sin(timeSinceSpawn * ud.zigzagFreq + ud.phaseOffset) * ud.zigzagAmp * dt *
                                3;
                            break;
                        case 'sine':
                            moveZ = -baseSpeed;
                            moveX = Math.sin(timeSinceSpawn * ud.sineFreq + ud.phaseOffset) * ud.sineAmp * dt * 2;
                            moveY = Math.cos(timeSinceSpawn * ud.sineFreq * 0.7 + ud.phaseOffset) * ud.sineAmp * 0.5 *
                                dt * 2;
                            break;
                        case 'boss':
                            moveZ = -baseSpeed * 0.5;
                            moveX = Math.sin(timeSinceSpawn * 0.8 + ud.phaseOffset) * 6 * dt;
                            moveY = Math.cos(timeSinceSpawn * 0.6 + ud.phaseOffset) * 4 * dt;
                            break;
                        case 'straight':
                        default:
                            moveZ = -baseSpeed;
                            // Лёгкое преследование игрока на высоких уровнях
                            if (this.level >= 3) {
                                const dx = playerPos.x - alien.position.x;
                                const dy = playerPos.y - alien.position.y;
                                moveX = Math.sign(dx) * Math.min(Math.abs(dx) * 0.3, 4) * dt;
                                moveY = Math.sign(dy) * Math.min(Math.abs(dy) * 0.2, 3) * dt;
                            }
                            break;
                    }

                    alien.position.x += moveX;
                    alien.position.y += moveY;
                    alien.position.z += moveZ;

                    // Вращение пришельца
                    alien.rotation.x += dt * 1.5;
                    alien.rotation.y += dt * 2.0;
                    alien.rotation.z += dt * 0.8;

                    // Стрельба пришельца
                    if (Math.random() < ud.shootChance && alien.position.z < 35 && alien.position.z > -3) {
                        const dirToPlayer = playerPos.clone().sub(alien.position).normalize();
                        this.spawnEnemyBullet(alien.position.clone(), dirToPlayer);
                    }

                    // Удаление если улетел далеко за игрока
                    if (alien.position.z < -10) {
                        this.scene.remove(alien);
                        this.aliens.splice(a, 1);
                        // Штраф за пропущенного
                        if (this.playerHealth > 0 && this.playerInvincible <= 0) {
                            this.playerTakeDamage(8);
                        }
                    }
                }
            }

            updateBullets(dt) {
                for (let b = this.bullets.length - 1; b >= 0; b--) {
                    const bullet = this.bullets[b];
                    if (!bullet || !bullet.userData) {
                        this.bullets.splice(b, 1);
                        continue;
                    }
                    bullet.position.add(bullet.userData.velocity.clone().multiplyScalar(dt));
                    bullet.userData.life -= dt;
                    if (bullet.userData.life <= 0 || bullet.position.z > 60) {
                        this.scene.remove(bullet);
                        this.bullets.splice(b, 1);
                    }
                }
            }

            updateEnemyBullets(dt) {
                for (let eb = this.enemyBullets.length - 1; eb >= 0; eb--) {
                    const eBullet = this.enemyBullets[eb];
                    if (!eBullet || !eBullet.userData) {
                        this.enemyBullets.splice(eb, 1);
                        continue;
                    }
                    eBullet.position.add(eBullet.userData.velocity.clone().multiplyScalar(dt));
                    eBullet.userData.life -= dt;
                    if (eBullet.userData.life <= 0 || eBullet.position.z < -15) {
                        this.scene.remove(eBullet);
                        this.enemyBullets.splice(eb, 1);
                    }
                }
            }

            updatePowerUps(dt) {
                for (let p = this.powerUps.length - 1; p >= 0; p--) {
                    const powerUp = this.powerUps[p];
                    if (!powerUp) continue;
                    powerUp.rotation.y += powerUp.userData.rotationSpeed * dt;
                    powerUp.rotation.x += powerUp.userData.rotationSpeed * 0.5 * dt;
                    powerUp.userData.life -= dt;
                    // Мерцание перед исчезновением
                    if (powerUp.userData.life < 2) {
                        powerUp.visible = Math.floor(this.gameTime * 8) % 2 === 0;
                    }
                    if (powerUp.userData.life <= 0) {
                        this.scene.remove(powerUp);
                        this.powerUps.splice(p, 1);
                    }
                }
            }

            updateParticles(dt) {
                for (const particle of this.particlePool) {
                    if (!particle.userData.active) continue;
                    particle.userData.life -= dt;
                    if (particle.userData.life <= 0) {
                        particle.userData.active = false;
                        particle.visible = false;
                        particle.material.opacity = 0;
                        continue;
                    }
                    particle.position.add(particle.userData.velocity.clone().multiplyScalar(dt));
                    particle.userData.velocity.multiplyScalar(0.96);
                    const lifeRatio = particle.userData.life / particle.userData.maxLife;
                    particle.material.opacity = lifeRatio;
                    particle.scale.setScalar(lifeRatio);
                }
            }

            updateSpawning(dt) {
                if (this.levelTransition && this.levelTransitionTimer > 0) return;
                if (this.aliensSpawned >= this.aliensToSpawnThisLevel) return;
                if (this.aliensDestroyedThisLevel >= this.aliensInLevel) return;

                this.alienSpawnTimer -= dt;
                if (this.alienSpawnTimer <= 0) {
                    this.spawnAlien();
                    this.alienSpawnTimer = this.alienSpawnInterval + Math.random() * 0.8;
                    // Убеждаемся что босс появляется последним если запланирован
                    if (this.aliensSpawned === this.aliensToSpawnThisLevel - 1 &&
                        this.level >= 5 &&
                        Math.random() < 0.5 &&
                        this.aliens.filter(a => a.userData.type === ALIEN_TYPES.BOSS).length === 0) {
                        // Последним spawn будет босс
                        this.spawnAlien('BOSS');
                        this.alienSpawnTimer = 99; // Больше не spawn-им
                    }
                }
            }

            updateTimers(dt) {
                // Кулдаун оружия
                if (this.fireCooldown > 0) {
                    this.fireCooldown -= dt;
                }

                // Неуязвимость
                if (this.playerInvincible > 0) {
                    this.playerInvincible -= dt;
                    if (this.playerInvincible <= 0 && this.playerShieldActive) {
                        this.playerShieldActive = false;
                        this.removeShieldEffect();
                    }
                }

                // Rapid fire
                if (this.playerRapidFire) {
                    this.playerRapidFireTimer -= dt;
                    if (this.playerRapidFireTimer <= 0) {
                        this.playerRapidFire = false;
                        this.playerRapidFireTimer = 0;
                    }
                }

                // Комбо
                if (this.comboTimer > 0) {
                    this.comboTimer -= dt;
                    if (this.comboTimer <= 0) {
                        this.comboCount = 0;
                        this.showCombo(0);
                    }
                }
            }

            updateScreenShake(dt) {
                if (this.screenShake > 0.001) {
                    this.screenShakeOffset.set(
                        (Math.random() - 0.5) * this.screenShake * 3,
                        (Math.random() - 0.5) * this.screenShake * 3,
                        (Math.random() - 0.5) * this.screenShake * 1.5
                    );
                    this.camera.position.copy(
                        this.cameraBasePosition.clone().add(this.screenShakeOffset)
                    );
                    this.screenShake *= GAME_CONFIG.SCREEN_SHAKE_DECAY;
                } else if (this.screenShake > 0) {
                    this.screenShake = 0;
                    this.screenShakeOffset.set(0, 0, 0);
                    this.camera.position.copy(this.cameraBasePosition);
                }
            }

            updateStarfield(dt) {
                // Медленное вращение звёздного поля
                if (this.starfield) {
                    this.starfield.rotation.y += dt * 0.015;
                    this.starfield.rotation.x += dt * 0.005;
                }
                if (this.spaceDustMesh) {
                    this.spaceDustMesh.rotation.y -= dt * 0.025;
                    this.spaceDustMesh.rotation.z += dt * 0.01;
                }
                // Вращение планеты
                if (this.distantPlanet) {
                    this.distantPlanet.rotation.y += dt * 0.08;
                }
                if (this.planetRing) {
                    this.planetRing.rotation.z += dt * 0.03;
                }
                // Анимация туманностей
                this.scene.children.forEach(child => {
                    if (child.name === 'nebula') {
                        child.rotation.y += dt * 0.02;
                        child.rotation.x += dt * 0.01;
                    }
                });
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // ==================== ЗАПУСК ИГРЫ ====================
        const game = new SpaceShooterGame();

        // Обработка клика для разблокировки аудио на мобильных
        document.addEventListener('click', () => {
            game.audio.resume();
        }, { once: true });

        // Обработка нажатия клавиши для разблокировки аудио
        document.addEventListener('keydown', () => {
            game.audio.resume();
        }, { once: true });

        console.log('🚀 Космический Страж 3D готов к бою!');
        console.log('🎮 Управление: WASD/Стрелки — движение, Пробел/ЛКМ — стрельба');
        console.log('🔫 Оружие: 1-4 или Q/E — переключение');
        console.log('⏸️ P — пауза');
        console.log('📋 Уровни открывают новое оружие: Ур.2 — Сдвоенная пушка, Ур.3 — Дробовой залп, Ур.4 — Тяжёлый бластер');
        console.log('👾 Каждые 5 уровней появляются БОССЫ!');
    </script>
</body>
